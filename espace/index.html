            } }, 'Ajouter')));
      });
    }

    function carteEvenement(evt, avecReponses) {
      const cl = 'evt' + (evt.etat === 'annule' ? ' annule' : '') + (estMatch(evt) ? ' evt-match ' + (evt.domicile === false ? 'exterieur' : 'domicile') : '');
      const c = el('div', { class: cl },
        el('div', { class: 'evt-tete' }, el('div', { class: 'evt-titre' }, titre(evt)), ...pastilles(evt)),
        blocRdv(evt),
        el('div', { class: 'evt-detail' }, details(evt).map(t => el('div', {}, t))),
        evt.consignes ? el('div', { class: 'consignes' }, evt.consignes) : null);
      if (avecReponses) for (const cv of E.convocations.filter(x => x.evenement_id === evt.id)) c.append(blocReponse(evt, cv));
      const cpt = compteur(evt); if (cpt) c.append(cpt);
      const cv = blocCovoit(evt); if (cv) c.append(cv);
      const tc = blocTaches(evt); if (tc) c.append(tc);
      const dr = blocDirect(evt); if (dr) c.append(dr);
      return c;
    }

    // ---------- Carte « Prochain match » (en tête de « À venir ») ----------
    function initiales(nom) {
      const mots = String(nom || '').replace(/[^A-Za-zÀ-ÿ0-9 ]/g, ' ').split(/\s+/).filter(m => m && !/^(fc|us|as|gj|es|ent|et|de|la|le)$/i.test(m));
      return (mots.slice(0, 2).map(m => m[0]).join('') || '?').toUpperCase();
    }
    function compteARebours(debut) {
      const ms = new Date(debut) - Date.now();
      if (ms <= 0) return [['En cours', '']];
      const min = Math.floor(ms / 60000), h = Math.floor(min / 60), j = Math.floor(h / 24);
      return j >= 2 ? [[j, 'jours'], [h % 24, 'heures']] : [[h, 'heures'], [min % 60, 'minutes']];
    }
    function quandCourt(debut) {
      const j = cleJour(debut), auj = cleJour(new Date()), dem = cleJour(Date.now() + 86400000);
      const hh = heure(debut);
      if (j === auj) return 'Aujourd\'hui, ' + hh;
      if (j === dem) return 'Demain, ' + hh;
      return jourDe(debut).split(' ').slice(0, 3).join(' ') + ', ' + hh;
    }
    function heroMatch(evt, avecReponses) {
      const eq = E.equipes.get(evt.equipe_id);
      const dest = evt.terrain && evt.terrain.lat ? evt.terrain.lat + ',' + evt.terrain.lon : [evt.lieu, evt.adresse].filter(Boolean).join(', ');
      const chips = el('div', { class: 'hero-chips' },
        sansHeure(evt) ? el('div', { class: 'hero-chip' }, el('b', {}, '?'), el('span', {}, 'horaire à confirmer'))
          : compteARebours(evt.debut).map(([n, l]) => el('div', { class: 'hero-chip', 'data-compte': evt.debut }, el('b', {}, String(n)), el('span', {}, l))),
        dest ? el('a', { class: 'hero-lieu', target: '_blank', rel: 'noopener', href: 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(dest) },
          el('span', {}, (evt.lieu || evt.adresse || 'Itinéraire').split(',').slice(-1)[0].replace(/^\s*\d{5}\s*/, '').trim() || 'Itinéraire')) : null);
      // Barre de présence (réponses de l'équipe)
      const r = E.resumes.get(evt.id) || [];
      const n = { present: 0, absent: 0, incertain: 0, sans_reponse: 0 };
      for (const x of r) if (x.reponse) n[x.reponse]++;
      const tot = r.length || 1, pct = (k) => (100 * n[k] / tot) + '%';
      const presence = r.length ? el('div', { class: 'hero-presence' },
        el('div', { class: 'hero-barre' },
          el('div', { class: 'barre' }, el('span', { style: 'background:#2fb36b;width:' + pct('present') }),
            el('span', { style: 'background:#f5a524;width:' + pct('incertain') }), el('span', { style: 'background:#e5484d;width:' + pct('absent') })),
          el('small', {}, n.present + ' présent' + (n.present > 1 ? 's' : '') + ' · ' + n.incertain + ' incertain' + (n.incertain > 1 ? 's' : '') +
            ' · ' + n.absent + ' absent' + (n.absent > 1 ? 's' : '') + ' · ' + n.sans_reponse + ' sans réponse'))) : null;
      const c = el('section', { class: 'hero', 'aria-label': 'Prochain match' },
        el('div', { class: 'hero-bandeau' }, el('span', { class: 'hero-point' }),
          el('span', { class: 'titre' }, 'Prochain match' + (evt.titre ? ' · ' + evt.titre : '')),
          el('span', { class: 'quand' }, sansHeure(evt) ? jourDe(evt.debut) : quandCourt(evt.debut))),
        el('div', { class: 'hero-corps' },
          el('div', { class: 'hero-face' },
            el('div', { class: 'equipe' }, el('img', { class: 'hero-ecusson', src: '../images/logo-fcg.png', alt: '' }), el('strong', {}, eq ? eq.nom : 'FC Gouesnou')),
            el('div', { class: 'hero-vs' }, el('b', {}, 'VS'), el('span', {}, evt.domicile === false ? 'Extérieur' : 'Domicile')),
            el('div', { class: 'equipe' }, el('div', { class: 'hero-ecusson' }, initiales(evt.adversaire)), el('strong', {}, evt.adversaire || 'Adversaire à venir'))),
          chips,
          blocRdv(evt),
          ...pastilles(evt).filter(p => !p.classList.contains('p-match')).length ? [el('div', { class: 'hero-detail' }, ...pastilles(evt).filter(p => !p.classList.contains('p-match')))] : [],
          evt.consignes ? el('div', { class: 'consignes' }, evt.consignes) : null));
      const corps = c.lastChild;
      if (avecReponses) for (const cv of E.convocations.filter(x => x.evenement_id === evt.id)) corps.append(blocReponse(evt, cv));
      if (presence) corps.append(presence);
      const cvt = blocCovoit(evt); if (cvt) corps.append(cvt);
      const tc = blocTaches(evt); if (tc) corps.append(tc);
      const dr = blocDirect(evt); if (dr) corps.append(dr);
      const l = listeConvoques(evt); if (l) corps.append(l);
      return c;
    }
    // Compte à rebours mis à jour chaque minute
    setInterval(() => {
      const vus = new Set();
      for (const n of document.querySelectorAll('.hero-chip[data-compte]')) {
        const d = n.getAttribute('data-compte'); if (vus.has(d)) continue; vus.add(d);
        const val = compteARebours(d), soeurs = [...document.querySelectorAll('.hero-chip[data-compte="' + d + '"]')];
        soeurs.forEach((s, i) => { if (val[i]) { s.firstChild.textContent = String(val[i][0]); s.lastChild.textContent = val[i][1]; } });
      }
    }, 60000);

    function afficherAvenir() {
      const zone = $('vueAvenir'); zone.replaceChildren();
      const mesEvt = new Set(E.convocations.map(c => c.evenement_id));
      const liste = E.evenements.filter(aVenir).filter(e => mesEvt.has(e.id) || (E.coachees.has(e.equipe_id) && E.miennes.has(e.equipe_id)));
      if (!E.fiches.length) { zone.append(el('p', { class: 'vide' }, "Votre compte n'est relié à aucune fiche du club. Contactez-nous par la rubrique « Nous contacter » du site.")); return; }
      if (!liste.length) { zone.append(el('p', { class: 'vide' }, 'Aucun événement à venir pour le moment.')); return; }
      // Le prochain match (non annulé) est mis en vedette, puis retiré de la liste
      const prochain = liste.find(e => estMatch(e) && e.etat !== 'annule' && (new Date(e.debut) > new Date(Date.now() - 2 * 3600 * 1000) || (sansHeure(e) && cleJour(e.debut) === cleJour(new Date()))));
      if (prochain) zone.append(heroMatch(prochain, true));
      let jour = '';
      for (const evt of liste) {
        if (evt === prochain) continue;
        const j = jourDe(evt.debut);
        if (j !== jour) { jour = j; zone.append(el('div', { class: 'jour' }, j)); }
        const c = carteEvenement(evt, true);
        const l = listeConvoques(evt); if (l) c.append(l);
        zone.append(c);
      }
    }

    // ---------- Vue coach ----------
    async function afficherCoach() {
      const zone = $('vueCoach'); zone.replaceChildren();
      const liste = E.evenements.filter(aVenir).filter(e => E.coachees.has(e.equipe_id));
      // Tâches de match de chaque équipe coachée (lavage, matériel, vestiaire...)
      const eqs = [...E.coachees].map(id => E.equipes.get(id)).filter(Boolean);
      if (eqs.length) zone.append(el('div', { class: 'taches-equipes' },
        eqs.flatMap(q => [el('button', { class: 'mini', onclick: () => gererTaches(q.id) }, 'Tâches de match - ' + q.nom),
          el('button', { class: 'mini', onclick: () => MT.ouvrirStats(q.id, q.nom) }, 'Statistiques - ' + q.nom)])));
      if (!liste.length) { zone.append(el('p', { class: 'vide' }, 'Aucun événement à venir. Créez-en un avec le bouton « + Nouvel événement ».')); return; }
      let jour = '';
      for (const evt of liste) {
        const j = jourDe(evt.debut);
        if (j !== jour) {
          jour = j; zone.append(el('div', { class: 'jour' }, j));
          // Un bouton « Composer » par équipe à sous-groupes qui a des matchs ce jour-là
          const ids = [...new Set(liste.filter(e => jourDe(e.debut) === j && estMatch(e) && e.etat !== 'annule' && avecGroupes(e.equipe_id)).map(e => e.equipe_id))];
          for (const id of ids) {
            const q = E.equipes.get(id);
            zone.append(el('button', { class: 'composer', onclick: () => composer(id, cleJour(evt.debut), j) },
              'Composer les équipes ' + q.sous_groupes.join(', ') + ' - ' + q.nom));
          }
        }
        const c = carteEvenement(evt, false);
        const det = el('details', { class: 'details-liste' }, el('summary', {}, 'Réponses détaillées'));
        det.addEventListener('toggle', async () => { if (det.open && det.children.length === 1) det.append(...await detailCoach(evt)); });
        const sansRep = (E.resumes.get(evt.id) || []).filter(x => x.reponse === 'sans_reponse').length;
        c.append(det, el('div', { class: 'actions-coach' },
          sansRep && evt.etat !== 'annule' ? el('button', { class: 'mini', onclick: () => relancer(evt, sansRep) }, 'Relancer les ' + sansRep + ' sans réponse') : null,
          el('button', { class: 'mini', onclick: () => formulaireEvenement(evt) }, 'Modifier'),
          evt.etat !== 'annule' ? el('button', { class: 'mini danger', onclick: () => annuler(evt) }, 'Annuler l\'événement') : null));
        zone.append(c);
      }
    }

    async function detailCoach(evt) {
      const [{ data: brut, error }, { data: mt }] = await Promise.all([sb.from('convocations')
        .select('personne_id, reponse, desiste_le, personne:personnes!convocations_personne_id_fkey(prenom, nom)')
        .eq('evenement_id', evt.id), sb.rpc('convocation_motifs', { evs: [evt.id] })]);
      if (error) return [el('p', { class: 'petit' }, 'Erreur : ' + error.message)];
      const data = ajouterMotifs((brut || []).map(x => ({ ...x, evenement_id: evt.id })), mt);
      const ordre = { sans_reponse: 0, incertain: 1, absent: 2, present: 3 };
      const lib = { present: 'Présent', absent: 'Absent', incertain: 'Incertain', sans_reponse: 'Sans réponse' };
      return (data || []).sort((a, b) => ordre[a.reponse] - ordre[b.reponse] || a.personne.nom.localeCompare(b.personne.nom))
        .map(x => el('div', { class: 'ligne-joueur' },
          el('span', {}, x.personne.prenom + ' ' + x.personne.nom),
          el('span', {}, lib[x.reponse] + (x.desiste_le ? ' (désisté)' : '') + (x.motif ? ' - ' + x.motif : x.a_motif ? ' - motif renseigné' : ''))));
    }

    async function relancer(evt, n) {
      if (!confirm('Envoyer un rappel aux ' + n + ' convoqués sans réponse (ou à leurs parents) ?')) return;
      const { data, error } = await sb.rpc('relancer_evenement', { p_evt: evt.id });
      if (error) { toast('Erreur : ' + error.message); return; }
      toast(data ? 'Rappel envoyé pour ' + data + ' convoqué' + (data > 1 ? 's' : '') + '.' : 'Rappel déjà envoyé il y a moins de 6 heures.');
    }

    async function annuler(evt) {
      if (!confirm('Annuler cet événement ? Les convoqués verront qu\'il est annulé.')) return;
      const { error } = await sb.from('evenements').update({ etat: 'annule' }).eq('id', evt.id);
      if (error) { toast('Erreur : ' + error.message); return; }
      toast('Événement annulé.'); charger();
    }

    // ---------- Composition des équipes A, B, C d'une journée ----------
    function composer(equipeId, jour, libJour) {
      const q = E.equipes.get(equipeId);
      ouvrirFenetre('Composer les équipes', async (f) => {
        f.append(el('p', { class: 'petit' }, q.nom + ' - ' + libJour));
        const attente = el('p', { class: 'petit' }, 'Chargement...'); f.append(attente);
        const { data, error } = await sb.rpc('composition_journee', { p_equipe: equipeId, p_jour: jour });
        attente.remove();
        if (error) { f.append(el('p', { class: 'erreur' }, 'Erreur : ' + error.message)); return; }
        const groupes = data.groupes || [];
        const evts = data.evenements || [];
        const lib = { present: 'présent', absent: 'absent', incertain: 'incertain', sans_reponse: 'sans réponse' };

        // 1. Équipe de chaque match
        const selGroupe = new Map();
        f.append(el('label', {}, 'Matchs du jour'));
        for (const ev of evts) {
          const s = el('select', { class: 'champ' }, el('option', { value: '' }, 'Équipe ?'),
            groupes.map(g => el('option', { value: g, selected: ev.groupe === g }, 'Équipe ' + g)));
          selGroupe.set(ev.id, s);
          const h = heure(ev.debut) === '00h00' ? '' : heure(ev.debut) + ' - ';
          f.append(el('div', { class: 'compo-match' },
            el('span', {}, h + (ev.adversaire ? (ev.domicile === false ? 'chez ' : 'contre ') + ev.adversaire : 'Match') + (ev.titre ? ' (' + ev.titre + ')' : '')), s));
        }

        // 2. Joueurs : A, B, C ou non retenu
        const choix = new Map((data.joueurs || []).map(j => [j.id, j.groupe || '']));
        const resume = el('div', { class: 'compteur compo-resume' });
        function majResume() {
          const n = Object.fromEntries(groupes.map(g => [g, 0])); let aucun = 0;
          for (const v of choix.values()) if (v) n[v]++; else aucun++;
          resume.replaceChildren(...groupes.map(g => el('span', { class: 'c-present' }, 'Équipe ' + g + ' : ' + n[g])),
            el('span', { class: 'c-sans' }, 'Non retenus : ' + aucun));
        }
        f.append(el('label', { style: 'margin-top:14px' }, 'Joueurs'), resume);
        for (const j of data.joueurs || []) {
          const seg = el('div', { class: 'seg' });
          const boutons = [...groupes, ''].map(g => el('button', { class: (g ? '' : 'aucun') + (choix.get(j.id) === g ? ' choisi' : ''),
            title: g ? 'Équipe ' + g : 'Non retenu',
            onclick: () => { choix.set(j.id, g); boutons.forEach(b => b.classList.toggle('choisi', b === boutons[[...groupes, ''].indexOf(g)])); majResume(); } }, g || '-'));
          seg.append(...boutons);
          f.append(el('div', { class: 'compo-joueur' },
            el('div', { class: 'nom' }, j.prenom + ' ' + j.nom, j.groupe ? el('small', {}, 'Réponse : ' + (lib[j.reponse] || '-')) : null), seg));
        }
        majResume();

        const enr = el('button', { class: 'btn principal' }, 'Enregistrer et convoquer');
        f.append(el('p', { class: 'petit' }, 'Les joueurs retenus sont convoqués au match de leur équipe. Un joueur retiré perd sa convocation et sa réponse.'),
          el('div', { class: 'boutons' }, el('button', { class: 'btn secondaire', onclick: fermerFenetre }, 'Fermer'), enr));

        enr.addEventListener('click', async () => {
          const pGroupes = {}; for (const [id, s] of selGroupe) pGroupes[id] = s.value;
          const pAff = {}; for (const [id, g] of choix) if (g) pAff[id] = g;
          const utilises = new Set(Object.values(pGroupes).filter(Boolean));
          const orphelins = [...new Set(Object.values(pAff))].filter(g => !utilises.has(g));
          if (orphelins.length && !confirm('Aucun match ce jour-là pour l\'équipe ' + orphelins.join(', ') + ' : ces joueurs ne seront pas convoqués. Continuer ?')) return;
          enr.disabled = true;
          const { data: n, error: e2 } = await sb.rpc('composer_journee', { p_equipe: equipeId, p_jour: jour, p_groupes: pGroupes, p_affectations: pAff });
          enr.disabled = false;
          if (e2) { toast('Erreur : ' + e2.message); return; }
          fermerFenetre(); toast('Composition enregistrée : ' + n + ' convocation' + (n > 1 ? 's' : '') + '.'); charger();
        });
      });
    }

    // ---------- Fenêtre ----------
    function ouvrirFenetre(t, remplir) {
      const v = $('fenetre'); v.replaceChildren();
      const f = el('div', { class: 'fenetre' }, el('h3', {}, t));
      // append() écrirait « null » : les éléments absents (conditions) sont ignorés
      const ajouter = f.append.bind(f); f.append = (...n) => ajouter(...n.flat().filter(x => x !== null && x !== undefined && x !== false));
      v.append(f); remplir(f); v.hidden = false;

    // ---------- Frais des coachs (administrateurs) ----------

    async function fraisTrajets(corps) {
      let { data, error } = await sbReel.rpc('frais_trajets', { p_depuis: FR.depuis, p_jusqua: FR.jusqua });
      if (error) throw error;
      // Kilomètres calculés une fois pour toutes (IGN) pour les trajets qui n'en ont pas encore
      const aCalculer = (data || []).filter(t => t.km_auto == null && t.trajet_valide == null).map(t => t.id);
      if (aCalculer.length) {
        await sbReel.functions.invoke('distance-trajets', { body: { ids: aCalculer } });
        ({ data } = await sbReel.rpc('frais_trajets', { p_depuis: FR.depuis, p_jusqua: FR.jusqua }));
      }
      corps.replaceChildren();
      const liste = data || [];
      const groupes = [['À valider', liste.filter(t => t.trajet_valide == null)], ['Validés', liste.filter(t => t.trajet_valide === true)], ['Non effectués', liste.filter(t => t.trajet_valide === false)]];
      corps.append(el('div', { class: 'boutons', style: 'margin-bottom:10px' }, el('button', { class: 'btn secondaire', onclick: ajouterTrajet }, 'Ajouter un trajet oublié')));

        for (const t of l) {
          const km = el('input', { class: 'km', type: 'number', min: 0, max: 2000, step: 0.1, value: t.km ?? t.km_auto ?? '' });

            const v = km.value === '' ? null : Number(km.value);
            const { error } = await sbReel.rpc('frais_valider', { p_offre: t.id, p_effectue: ok, p_km: v });

                : el('button', { class: 'mini danger', onclick: () => valider(false) }, 'Non effectué'))));
        }
      }
    }

    const SE_GROUPES = [
      ['nouveau_membre', 'Nouveaux membres d\'équipe'], ['depart', 'Départs'], ['role', 'Rôles'],
      ['coordonnees', 'Coordonnées'], ['annee', 'Années de naissance'],

    async function lirePropositionsSE() {
      const { data, error } = await sbReel.from('maj_sporteasy').select('id, type, libelle, detail, fichier, cree_le')
        .eq('statut', 'à valider').order('type').order('libelle');

    async function majCarteSportEasy() {
      const c = $('carteSportEasy');
      if (!AP.suisAdmin || AP.actif) { c.hidden = true; return; }
      let props = [];
      try { props = await lirePropositionsSE(); } catch (e) { c.hidden = true; return; }
      c.replaceChildren();
      if (!props.length) { c.hidden = true; return; }
      c.append(el('div', { class: 'texte' }, 'Mises à jour SportEasy : ' + props.length + ' proposition' + (props.length > 1 ? 's' : '') + ' à valider',

        el('button', { class: 'mini principal', onclick: ouvrirSportEasy }, 'Voir'));

    async function ouvrirSportEasy() {
      let props;
      try { props = await lirePropositionsSE(); } catch (e) { toast('Erreur : ' + e.message); return; }
      ouvrirFenetre('Mises à jour SportEasy', (f) => {
        f.classList.add('large');
        f.append(el('p', { class: 'petit' }, 'Différences entre la dernière extraction SportEasy et l\'application. « Appliquer » modifie la fiche ; « Ignorer » écarte la proposition, qui ne reviendra pas.'));
        const zone = el('div', {});
        const dessiner = () => {
          zone.replaceChildren();
          if (!props.length) { zone.append(el('p', { class: 'vide' }, 'Plus aucune proposition à valider.')); return; }
          for (const [type, titreGroupe] of SE_GROUPES) {
            const liste = props.filter(p => p.type === type);
            if (!liste.length) continue;
            zone.append(el('div', { class: 'se-groupe' }, titreGroupe + ' (' + liste.length + ')'));
            for (const p of liste) {
              const traiter = async (fonction, bouton) => {
                bouton.disabled = true;
                const { error } = await sbReel.rpc(fonction, { p_id: p.id });
                if (error) { bouton.disabled = false; toast('Erreur : ' + error.message); return; }
                toast(fonction === 'maj_sporteasy_appliquer' ? 'Appliqué.' : 'Ignoré.');
                props = props.filter(x => x.id !== p.id);
                dessiner(); majCarteSportEasy();
                if (fonction === 'maj_sporteasy_appliquer') charger();
              };
              const bA = el('button', { class: 'mini principal' }, 'Appliquer');
              const bI = el('button', { class: 'mini' }, 'Ignorer');

                el('div', { class: 'actions' }, bA, bI)));
            }
          }
        };
        dessiner();
        f.append(zone, el('div', { class: 'boutons' }, el('button', { class: 'btn secondaire', onclick: fermerFenetre }, 'Fermer')));
      });

      $('ecranConnexion').hidden = !!s;
      $('ecranAppli').hidden = !s;
      if (!s) { AP.actif = null; AP.suisAdmin = false; AP.peutApercu = false; dessinerBandeau(); $('btnApercu').hidden = true; $('carteSportEasy').hidden = true; }
      if (s) setTimeout(async () => {
        majCarteNotif(); preparerPartenaires(); verifierAdmin(); verifierVersion();
        await charger();
        if (ficheDemandee) { const id = ficheDemandee; ficheDemandee = null; ouvrirFiche(id); }
      }, 0);
    }
    sb.auth.onAuthStateChange((evenement, s) => {
      if (s && (location.search || location.hash)) history.replaceState(null, '', ADRESSE_APPLI);
      if (evenement === 'SIGNED_IN' || evenement === 'SIGNED_OUT' || evenement === 'INITIAL_SESSION') basculer(s);
    });
  </script>

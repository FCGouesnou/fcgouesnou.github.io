<!DOCTYPE html>
<!--
  FC Gouesnou - Espace club (application Supabase)
  Fichier : espace/index.html (dépôt GitHub fcgouesnou.github.io)
  Rôle : application du pilote Espace équipes - connexion, écran « À venir »,
         réponses aux convocations, vue coach (création d'événements, suivi des réponses,
         composition des équipes A, B, C d'une journée), application installable et notifications
  Fichiers liés : espace/partenaires.js, espace/manifest.webmanifest, espace/sw.js, espace/icone-*.png
  Version : 0.12.1 - 14/11/2026 - désignation : liste « Nom Prénom » par ordre alphabétique, coach et parent distingués
           0.12 - 14/11/2026 - covoiturage : le coach désigne un conducteur, qui accepte ou refuse
           0.11.3 - 14/11/2026 - places de covoiturage : « places libres pour d'autres joueurs », sans compter son enfant
           0.11.2 - 14/11/2026 - nombre de places à choisir (plus de valeur par défaut)
           0.11.1 - 14/11/2026 - « null » retiré du formulaire de proposition de places
           0.11 - 14/11/2026 - covoiturage des matchs et tournois : proposer des places, chercher une place,
           réserver ou libérer une place pour son enfant ; téléphones visibles entre les personnes concernées
           0.10 - 14/11/2026 - « Mises à jour SportEasy » (administrateurs) : propositions issues de la
           comparaison nocturne avec l'extraction SportEasy, à appliquer ou ignorer une par une
           0.9.1 - 13/11/2026 - Partenaires 1.4 : listes de travail actionnables (actions, paiements,
           renouvellements, échéances, sans suite)
           0.9 - 13/11/2026 - « Voir en tant que » (administrateurs) : aperçu en lecture seule de l'application
           telle qu'une personne la voit, avec sa fiche droits ; chaque aperçu est noté dans le journal
           0.8.3 - 13/11/2026 - Partenaires 1.3 : rôle « finances » pour le comptable
           0.8.2 - 12/11/2026 - Partenaires 1.2 : relier ou écarter les écritures du contrôle compta
           0.8.1 - 12/11/2026 - carte des notifications affichée une seule fois
           0.8 - 12/11/2026 - Partenaires 1.1 : tableau de bord, documents avec les contrats, casse à l'enregistrement
           0.7 - 12/11/2026 - onglet « Partenaires » (module espace/partenaires.js) pour le CODIR
            (consultation) et la commission partenaires (modification)
  Historique :
    0.6   - 12/11/2026 - lieu choisi par commune puis terrain (référentiel Data ES des terrains
            de football du Finistère), lien « Itinéraire » sur les événements
    0.5.1 - 12/11/2026 - bouton « + Nouvel événement » affiché seulement dans « Mes équipes »
    0.5   - 12/11/2026 - application installable (manifeste, service worker, icônes),
            notifications : activation par appareil, test, consignes iPhone ; relance manuelle
            des non-répondants par le coach ; appareil détaché du compte à la sortie
    0.4.2 - 12/11/2026 - sondages SportEasy annulés masqués ; « À venir » limité à mes
            équipes et à ma famille (l'administrateur gère les autres dans « Mes équipes »)
    0.4.1 - 12/11/2026 - version affichée en bas de l'application ; quatre semaines
            d'événements chargées (au lieu des 40 premiers)
    0.4   - 12/11/2026 - équipes A, B, C (U12-U13) : écran « Composer les équipes »,
            équipe affichée sur les matchs, horaire à confirmer
    0.3.1 - 12/11/2026 - logo du club (connexion, bandeau, icône)
    0.3   - 12/11/2026 - écran « À venir », réponse en un geste, désistement, vue coach
    0.2.1 - 12/11/2026 - premier code possible pour toute adresse connue du club
    0.2   - 11/11/2026 - connexion par code reçu par e-mail
    0.1   - 11/11/2026 - page de test de la connexion Google
-->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1a3a8f">
  <title>Espace club - FC Gouesnou</title>
  <link rel="icon" type="image/png" href="../images/logo-fcg.png">
  <link rel="apple-touch-icon" href="icone-apple-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FC Gouesnou">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Barlow+Condensed:wght@600&display=swap" rel="stylesheet">
  <style>
    :root { --bleu: #1a3a8f; --bleu-clair: #e8eefb; --texte: #1d2433; --gris: #6b7280; --gris-clair: #eef0f4;
            --rouge: #b42318; --rouge-clair: #fdecea; --vert: #067647; --vert-clair: #e7f6ec; --orange: #b54708; --orange-clair: #fef4e6; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, system-ui, sans-serif; color: var(--texte); background: #f5f7fb; }
    button, input, select, textarea { font: inherit; }
    [hidden] { display: none !important; }

    /* Connexion */
    .centre { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .carte-connexion { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(26,58,143,.12); padding: 32px 28px; width: 100%; max-width: 380px; text-align: center; }
    .logo-connexion { width: 96px; height: 96px; display: block; margin: 0 auto 12px; }
    .logo-entete { width: 34px; height: 34px; background: #fff; border-radius: 50%; padding: 2px; }
    h1 { font-family: "Barlow Condensed", sans-serif; font-weight: 600; color: var(--bleu); font-size: 2rem; margin: 0 0 4px; }
    .sous-titre { color: var(--gris); margin: 0 0 28px; }
    .btn { width: 100%; border: 0; border-radius: 10px; padding: 14px; font-weight: 600; cursor: pointer; }
    .btn:disabled { opacity: .6; cursor: wait; }
    .principal { background: var(--bleu); color: #fff; }
    .secondaire { background: var(--bleu-clair); color: var(--bleu); }
    .lien { background: none; border: 0; color: var(--gris); font-size: .9rem; padding: 10px; cursor: pointer; }
    .champ { width: 100%; border: 1px solid #cfd6e4; border-radius: 10px; padding: 13px; margin-bottom: 12px; background: #fff; }
    .champ:focus { outline: 2px solid var(--bleu); border-color: transparent; }
    #code { text-align: center; font-size: 1.5rem; letter-spacing: 6px; font-weight: 600; }
    .separateur { display: flex; align-items: center; gap: 10px; color: var(--gris); font-size: .85rem; margin: 22px 0; }
    .separateur::before, .separateur::after { content: ""; flex: 1; height: 1px; background: #e2e6ef; }
    .info { color: var(--vert); font-size: .9rem; margin: 0 0 14px; }
    .erreur { color: var(--rouge); margin-top: 16px; font-size: .9rem; }
    .erreur a { color: var(--rouge); }
    .petit { color: var(--gris); font-size: .8rem; }

    /* Application */
    .entete { position: sticky; top: 0; z-index: 5; background: var(--bleu); color: #fff; padding: 12px 16px calc(12px) ; display: flex; align-items: center; gap: 12px; }
    .entete h2 { font-family: "Barlow Condensed", sans-serif; font-weight: 600; font-size: 1.5rem; margin: 0; flex: 1; }
    .entete button { background: rgba(255,255,255,.15); color: #fff; border: 0; border-radius: 8px; padding: 8px 12px; cursor: pointer; font-size: .85rem; }
    .contenu { max-width: 640px; margin: 0 auto; padding: 16px 12px 96px; }
    .onglets { display: flex; gap: 8px; margin-bottom: 14px; }
    .onglet { flex: 1; border: 0; background: #fff; border-radius: 10px; padding: 10px; color: var(--gris); font-weight: 600; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
    .onglet.actif { background: var(--bleu); color: #fff; }
    .bonjour { color: var(--gris); margin: 4px 4px 14px; font-size: .95rem; }
    .vide { text-align: center; color: var(--gris); padding: 40px 12px; }
    .jour { font-weight: 600; color: var(--gris); font-size: .85rem; margin: 18px 4px 8px; }
    .evt { background: #fff; border-radius: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06); padding: 14px; margin-bottom: 10px; }
    .evt.annule { opacity: .65; }
    .evt-tete { display: flex; gap: 10px; align-items: flex-start; }
    .pastille { font-size: .72rem; font-weight: 600; border-radius: 6px; padding: 3px 7px; white-space: nowrap; }
    .p-match { background: var(--orange-clair); color: var(--orange); }
    .p-entrainement { background: var(--bleu-clair); color: var(--bleu); }
    .p-autre { background: var(--gris-clair); color: var(--gris); }
    .p-annule { background: var(--rouge-clair); color: var(--rouge); }
    .p-modifie { background: var(--orange-clair); color: var(--orange); }
    .p-groupe { background: var(--bleu); color: #fff; }
    .p-sansgroupe { background: var(--gris-clair); color: var(--gris); }
    .composer { width: 100%; margin: 0 0 10px; border: 1.5px dashed var(--bleu); background: var(--bleu-clair); color: var(--bleu); border-radius: 12px; padding: 11px; font-weight: 600; cursor: pointer; }
    .compo-match { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--gris-clair); font-size: .88rem; }
    .compo-match span { flex: 1; }
    .compo-match select { width: auto; margin: 0; padding: 7px; }
    .compo-joueur { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--gris-clair); }
    .compo-joueur .nom { flex: 1; font-size: .92rem; }
    .compo-joueur .nom small { display: block; color: var(--gris); font-size: .75rem; }
    .seg { display: flex; gap: 4px; }
    .seg button { min-width: 36px; border: 1.5px solid #d5dbe7; background: #fff; border-radius: 8px; padding: 7px 0; font-weight: 600; cursor: pointer; color: var(--texte); }
    .seg button.choisi { background: var(--bleu); border-color: var(--bleu); color: #fff; }
    .seg button.aucun.choisi { background: var(--gris); border-color: var(--gris); }
    /* Partenaires */
    .fenetre.large { max-width: 860px; }
    .bandeau-apercu { background: #fff4e0; border: 2px solid #e8a33a; border-radius: 14px; padding: 12px 14px; margin-bottom: 14px; font-size: .88rem; }
    .bandeau-apercu .ligne-titre { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    .bandeau-apercu strong { color: #8a4b00; }
    .bandeau-apercu ul { margin: 8px 0 0; padding-left: 18px; color: var(--texte); }
    .liste-apercu { display: grid; gap: 6px; margin-top: 10px; max-height: 50vh; overflow: auto; }
    .p-tuiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 8px 0 14px; }
    .p-tuile { background: #fff; border: 0; border-radius: 12px; padding: 10px 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06); text-align: left; color: var(--texte); font: inherit; }
    .p-tuile.p-cliquable { cursor: pointer; }
    .p-tuile strong { display: block; font-size: 1.2rem; color: var(--bleu); }
    .p-tuile span { display: block; font-size: .8rem; color: var(--gris); }
    .p-tuile small { display: block; font-size: .74rem; color: var(--gris); margin-top: 4px; }
    .p-tuile-large { grid-column: 1 / -1; }
    .p-jauge { height: 8px; background: #e6e9f2; border-radius: 4px; margin-top: 8px; overflow: hidden; }
    .p-jauge div { height: 100%; background: var(--bleu); border-radius: 4px; }
    .p-evo { display: flex; gap: 10px; align-items: flex-end; height: 170px; background: #fff; border-radius: 12px; padding: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    .p-evo-col { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; font-size: .74rem; color: var(--gris); }
    .p-evo-barres { flex: 1; width: 100%; display: flex; gap: 3px; align-items: flex-end; justify-content: center; }
    .p-evo-barres div { width: 40%; max-width: 26px; border-radius: 4px 4px 0 0; }
    .p-evo-att { background: #c9d1e6; } .p-evo-rec { background: var(--bleu); }
    .p-leg { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: middle; }
    .p-bloc-tb { margin-top: 10px; } .p-bloc-tb .p-ligne { margin-top: 6px; }
    .p-docs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 10px; }
    .p-resume { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-bottom: 12px; }
    .p-resume div { background: #fff; border-radius: 12px; padding: 10px 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    .p-resume strong { display: block; font-size: 1.15rem; color: var(--bleu); }
    .p-resume span { font-size: .78rem; color: var(--gris); }
    .p-barre { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
    .p-barre .champ { flex: 1; min-width: 180px; margin: 0; }
    .p-liste { display: flex; flex-direction: column; gap: 6px; }
    .p-ligne { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; text-align: left; width: 100%; border: 0; background: #fff; border-radius: 12px; padding: 11px 13px; box-shadow: 0 1px 3px rgba(0,0,0,.06); cursor: pointer; color: var(--texte); }
    .p-ligne-nom { font-weight: 600; }
    .p-ligne-nom small { display: block; font-weight: 400; color: var(--gris); font-size: .78rem; }
    .p-ligne-info { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .p-marque { display: inline-block; background: var(--orange-clair); color: var(--orange); border-radius: 6px; padding: 2px 7px; font-size: .75rem; margin: 4px 4px 0 0; }
    .p-onglets { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0; }
    .p-onglets .onglet { flex: none; padding: 8px 12px; font-size: .85rem; background: var(--gris-clair); }
    .p-onglets .onglet.actif { background: var(--bleu); }
    .p-contrat { border: 1px solid #e2e6ef; border-radius: 12px; padding: 10px 12px; margin: 10px 0; }
    .p-contrat-tete { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .p-contrat-tete .petit { flex: 1; }
    .p-echeance { border-top: 1px solid var(--gris-clair); padding: 8px 0; }
    .p-echeance-tete { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .p-echeance-tete > span:first-child { flex: 1; }
    .p-paiement { display: flex; gap: 8px; justify-content: space-between; align-items: center; flex-wrap: wrap; font-size: .85rem; padding: 6px 0 6px 10px; border-left: 3px solid var(--bleu-clair); margin: 6px 0; }
    .p-paiement > span:first-child { flex: 1; }
    .p-boutons { display: flex; gap: 6px; }
    .p-bloc { display: block; color: var(--gris); white-space: pre-wrap; margin-top: 3px; }
    .p-titre { margin: 18px 0 4px; color: var(--bleu); }
    .p-case { display: flex !important; gap: 8px; align-items: center; color: var(--texte) !important; margin: 4px 0 10px; }
    .p-champ .champ { margin-bottom: 10px; }
    a.mini { text-decoration: none; display: inline-block; }
    .itineraire { color: var(--bleu); font-weight: 500; text-decoration: none; }
    .compo-resume { position: sticky; top: -20px; background: #fff; padding: 8px 0; z-index: 1; }
    .evt-titre { font-weight: 600; flex: 1; }
    .evt-detail { color: var(--gris); font-size: .88rem; margin-top: 4px; line-height: 1.45; }
    .consignes { background: var(--gris-clair); border-radius: 8px; padding: 8px 10px; font-size: .85rem; margin-top: 8px; white-space: pre-wrap; }
    .personne { border-top: 1px solid var(--gris-clair); margin-top: 12px; padding-top: 10px; }
    .personne-nom { font-size: .88rem; font-weight: 500; margin-bottom: 8px; display: flex; justify-content: space-between; gap: 8px; }
    .reponses { display: flex; gap: 6px; }
    .rep { flex: 1; border: 1.5px solid #d5dbe7; background: #fff; border-radius: 10px; padding: 10px 4px; font-weight: 600; font-size: .88rem; cursor: pointer; color: var(--texte); }
    .rep.present.choisi { background: var(--vert); border-color: var(--vert); color: #fff; }
    .rep.absent.choisi { background: var(--rouge); border-color: var(--rouge); color: #fff; }
    .rep.incertain.choisi { background: var(--orange); border-color: var(--orange); color: #fff; }
    .rep:disabled { cursor: default; opacity: .55; }
    .motif { display: flex; gap: 6px; margin-top: 8px; }
    .motif input { flex: 1; margin: 0; padding: 9px; }
    .motif button { border: 0; background: var(--bleu); color: #fff; border-radius: 8px; padding: 0 12px; cursor: pointer; }
    .note { font-size: .8rem; color: var(--gris); margin-top: 6px; }
    .compteur { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; font-size: .8rem; }
    .compteur span { border-radius: 6px; padding: 3px 8px; }
    .c-present { background: var(--vert-clair); color: var(--vert); }
    .c-absent { background: var(--rouge-clair); color: var(--rouge); }
    .c-incertain { background: var(--orange-clair); color: var(--orange); }
    .c-sans { background: var(--gris-clair); color: var(--gris); }
    .details-liste { margin-top: 8px; font-size: .85rem; }
    .details-liste summary { cursor: pointer; color: var(--bleu); font-weight: 500; }
    .ligne-joueur { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--gris-clair); }
    .ligne-joueur:last-child { border-bottom: 0; }
    .actions-coach { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
    .mini { border: 0; border-radius: 8px; padding: 8px 10px; font-size: .82rem; font-weight: 600; cursor: pointer; background: var(--bleu-clair); color: var(--bleu); }
    .mini.danger { background: var(--rouge-clair); color: var(--rouge); }
    .mini.principal { background: var(--bleu); color: #fff; }
    .p-lien { background: none; border: 0; padding: 0; text-align: left; font: inherit; color: inherit; cursor: pointer; flex: 1; min-width: 180px; }
    .p-bloc-tb div.p-ligne { cursor: default; }
    .carte-notif { background: #fff; border-radius: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06); padding: 12px 14px; margin-bottom: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: .88rem; }
    .carte-notif .texte { flex: 1; min-width: 200px; color: var(--texte); }
    .carte-notif .texte small { display: block; color: var(--gris); margin-top: 2px; }
    .carte-notif.ok { background: var(--vert-clair); box-shadow: none; }
    .carte-notif.se { background: var(--orange-clair); box-shadow: none; }
    .se-groupe { margin: 14px 0 6px; font-weight: 600; color: var(--bleu); font-size: .9rem; }
    .se-ligne { border-top: 1px solid var(--gris-clair); padding: 10px 0; display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
    .se-ligne .texte { flex: 1; min-width: 220px; font-size: .88rem; }
    .se-ligne .texte small { display: block; color: var(--gris); margin-top: 3px; }
    .se-ligne .actions { display: flex; gap: 6px; }
    .covoit { margin-top: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .85rem; }
    .covoit .texte { flex: 1; min-width: 180px; color: var(--gris); }
    .covoit .texte strong { color: var(--texte); font-weight: 600; }
    .cv-bloc { border-top: 1px solid var(--gris-clair); padding: 10px 0; font-size: .88rem; }
    .cv-bloc .cv-titre { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; flex-wrap: wrap; }
    .cv-bloc .cv-titre .libre { color: var(--vert); font-weight: 500; }
    .cv-bloc .cv-titre .plein { color: var(--gris); font-weight: 500; }
    .cv-bloc .cv-info { color: var(--gris); margin-top: 3px; }
    .cv-bloc .cv-passager { display: flex; justify-content: space-between; gap: 8px; align-items: center; padding: 4px 0 0 12px; }
    .cv-bloc .cv-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .cv-bloc a { color: var(--bleu); }
    .flottant { position: fixed; right: 16px; bottom: calc(20px + env(safe-area-inset-bottom)); background: var(--bleu); color: #fff; border: 0; border-radius: 28px; padding: 14px 20px; font-weight: 600; box-shadow: 0 6px 18px rgba(26,58,143,.35); cursor: pointer; }

    /* Fenêtre */
    .voile { position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
    .fenetre { background: #fff; width: 100%; max-width: 560px; max-height: 92vh; overflow: auto; border-radius: 18px 18px 0 0; padding: 20px 18px calc(20px + env(safe-area-inset-bottom)); }
    @media (min-width: 640px) { .voile { align-items: center; } .fenetre { border-radius: 18px; } }
    .fenetre h3 { margin: 0 0 14px; font-family: "Barlow Condensed", sans-serif; font-weight: 600; font-size: 1.5rem; color: var(--bleu); }
    .fenetre label { display: block; font-size: .82rem; font-weight: 600; color: var(--gris); margin-bottom: 4px; }
    .deux { display: flex; gap: 10px; } .deux > div { flex: 1; }
    .choix-joueurs { max-height: 240px; overflow: auto; border: 1px solid #e2e6ef; border-radius: 10px; padding: 6px 10px; margin-bottom: 12px; }
    .choix-joueurs label { display: flex; gap: 8px; align-items: center; color: var(--texte); font-weight: 400; font-size: .92rem; padding: 6px 0; margin: 0; }
    .boutons { display: flex; gap: 8px; margin-top: 6px; }
    .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom)); background: #1d2433; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: .9rem; z-index: 30; max-width: 90vw; }
  </style>
</head>
<body>

  <!-- ===================== Connexion ===================== -->
  <div id="ecranConnexion" class="centre" hidden>
    <main class="carte-connexion">
      <img class="logo-connexion" src="../images/logo-fcg.png" alt="Logo du FC Gouesnou">
      <h1>Espace club</h1>
      <p class="sous-titre">FC Gouesnou</p>

      <section id="choixConnexion">
        <button class="btn principal" id="btnGoogle">Se connecter avec Google</button>
        <p class="petit" style="margin-top:8px;">Pour les comptes fcgouesnou.com</p>
        <div class="separateur">ou</div>
        <form id="formEmail">
          <input class="champ" type="email" id="email" placeholder="Votre adresse e-mail" autocomplete="email" required>
          <button class="btn secondaire" id="btnCode" type="submit">Recevoir un code par e-mail</button>
        </form>
      </section>

      <section id="saisieCode" hidden>
        <p class="info" id="infoCode"></p>
        <form id="formCode">
          <input class="champ" type="text" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="Code" required>
          <button class="btn principal" id="btnValider" type="submit">Valider le code</button>
        </form>
        <button class="lien" id="btnRetour">Changer d'adresse ou renvoyer un code</button>
      </section>

      <p class="erreur" id="erreurConnexion" hidden></p>
      <p class="petit" style="margin-top:24px;">Version 0.12.1 - pilote</p>
    </main>
  </div>

  <!-- ===================== Application ===================== -->
  <div id="ecranAppli" hidden>
    <header class="entete">
      <img class="logo-entete" src="../images/logo-fcg.png" alt="">
      <h2>Espace club</h2>
      <button id="btnApercu" title="Voir l'application comme une autre personne" hidden>Voir en tant que</button>
      <button id="btnActualiser" title="Actualiser">Actualiser</button>
      <button id="btnSortir">Sortir</button>
    </header>
    <div class="contenu">
      <div id="bandeauApercu" class="bandeau-apercu" hidden></div>
      <p class="bonjour" id="bonjour"></p>
      <div id="carteSportEasy" class="carte-notif se" hidden></div>
      <div id="carteNotif" class="carte-notif" hidden></div>
      <div class="onglets" id="onglets" hidden>
        <button class="onglet actif" data-vue="avenir">À venir</button>
        <button class="onglet" data-vue="coach" hidden>Mes équipes</button>
        <button class="onglet" data-vue="partenaires" hidden>Partenaires</button>
      </div>
      <div id="vueAvenir"></div>
      <div id="vueCoach" hidden></div>
      <div id="vuePartenaires" hidden></div>
      <p class="petit" style="text-align:center; margin-top:28px;">Espace club FC Gouesnou - version 0.12.1 - pilote</p>
    </div>
    <button class="flottant" id="btnNouvel" hidden>+ Nouvel événement</button>
  </div>

  <div id="fenetre" class="voile" hidden></div>
  <div id="toast" class="toast" hidden></div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    import { initPartenaires } from './partenaires.js?v=1.4.1';

    // ---------- Configuration ----------
    const SUPABASE_URL = 'https://ppzzqnkxeslkeijeradc.supabase.co';
    const SUPABASE_CLE = 'sb_publishable_uEaNogIeXycWb3cIL7rumg_8udo1u_0';
    const ADRESSE_APPLI = 'https://fcgouesnou.github.io/espace/';
    const PAGE_CONTACT = 'https://fcgouesnou.github.io/#contact';
    const FUSEAU = 'Europe/Paris';

    const sbReel = createClient(SUPABASE_URL, SUPABASE_CLE, {
      auth: { flowType: 'pkce', detectSessionInUrl: true, persistSession: true }
    });

    // ---------- Aperçu « Voir en tant que » (lecture seule) ----------
    // Pendant un aperçu, toute écriture est refusée côté écran et les fonctions qui dépendent
    // de la personne connectée renvoient les valeurs calculées pour la personne observée.
    const AP = { actif: null, suisAdmin: false };
    const RPC_LECTURE = new Set(['covoiturage_evenements', 'covoit_candidats', 'convocations_evenement', 'composition_journee', 'communes_terrains', 'part_tableau_bord']);
    const MSG_APERCU = 'Aperçu en lecture seule : aucune modification n\'est enregistrée.';
    function refus() {
      const r = { data: null, error: { message: MSG_APERCU } };
      const f = new Proxy(function () {}, {
        get: (t, k) => k === 'then' ? (a, b) => Promise.resolve(r).then(a, b) : () => f,
        apply: () => f });
      return f;
    }
    const sb = new Proxy(sbReel, { get(t, k) {
      if (k === 'from') return (table) => {
        const q = t.from(table);
        if (!AP.actif) return q;
        return new Proxy(q, { get(q2, m) {
          if (['insert', 'update', 'upsert', 'delete'].includes(m)) return () => refus();
          const v = q2[m]; return typeof v === 'function' ? v.bind(q2) : v; } });
      };
      if (k === 'rpc') return (nom, args) => {
        if (AP.actif) {
          const ok = (data) => Promise.resolve({ data, error: null });
          if (nom === 'mes_roles') return ok(AP.actif.roles);
          if (nom === 'mes_equipes') return ok(AP.actif.mes_equipes);
          if (nom === 'equipes_coachees') return ok(AP.actif.equipes_coachees);
          if (!RPC_LECTURE.has(nom)) return refus();
        }
        return t.rpc(nom, args);
      };
      const v = t[k]; return typeof v === 'function' ? v.bind(t) : v;
    } });

    const $ = (id) => document.getElementById(id);
    const el = (tag, attrs = {}, ...enfants) => {
      const n = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs)) {
        if (k === 'class') n.className = v;
        else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
        else if (v !== undefined && v !== null && v !== false) n.setAttribute(k, v === true ? '' : v);
      }
      for (const e of enfants.flat()) if (e !== null && e !== undefined && e !== false) n.append(e instanceof Node ? e : document.createTextNode(e));
      return n;
    };

    // ---------- État ----------
    let session = null;
    let emailEnCours = '';
    const E = { fiches: [], personnes: new Map(), repondPour: new Set(), equipes: new Map(), coachees: new Set(), miennes: new Set(),
                evenements: [], convocations: [], resumes: new Map(), clubs: new Map(), covoit: new Map() };

    // ---------- Outils ----------
    function toast(t) { const n = $('toast'); n.textContent = t; n.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => n.hidden = true, 3200); }
    const fmtJour = new Intl.DateTimeFormat('fr-FR', { timeZone: FUSEAU, weekday: 'long', day: 'numeric', month: 'long' });
    const fmtHeure = new Intl.DateTimeFormat('fr-FR', { timeZone: FUSEAU, hour: '2-digit', minute: '2-digit' });
    const jourDe = (d) => { const s = fmtJour.format(new Date(d)); return s.charAt(0).toUpperCase() + s.slice(1); };
    const heure = (d) => fmtHeure.format(new Date(d)).replace(':', ' h ');
    const LIB_TYPE = { match: 'Match', entrainement: 'Entraînement', tournoi: 'Tournoi', reunion: 'Réunion', autre: 'Événement' };
    const age = (p) => p.annee_naissance ? new Date().getFullYear() - p.annee_naissance : null;
    const fmtCle = new Intl.DateTimeFormat('en-CA', { timeZone: FUSEAU, year: 'numeric', month: '2-digit', day: '2-digit' });
    const cleJour = (d) => fmtCle.format(new Date(d));
    const sansHeure = (evt) => heure(evt.debut) === '00 h 00' && !evt.fin;
    const avecGroupes = (equipeId) => { const q = E.equipes.get(equipeId); return q && q.sous_groupes && q.sous_groupes.length ? q.sous_groupes : null; };
    const estMatch = (evt) => evt.type === 'match' || evt.type === 'tournoi';

    function messageErreur(error) {
      const m = (error && error.message || '').toLowerCase();
      if (m.includes('pas connue du club') || m.includes('signups not allowed') || m.includes('user not found'))
        return 'inconnue';
      if (m.includes('expired') || m.includes('invalid')) return 'Code incorrect ou expiré. Vérifiez le dernier e-mail reçu, ou demandez un nouveau code.';
      if (m.includes('rate limit') || m.includes('security purposes')) return 'Trop de demandes rapprochées. Patientez une minute avant de redemander un code.';
      return 'Erreur : ' + (error && error.message || 'inconnue');
    }
    function erreurConnexion(texte) {
      const n = $('erreurConnexion'); n.replaceChildren();
      if (!texte) { n.hidden = true; return; }
      if (texte === 'inconnue') {
        n.append("Cette adresse n'est pas connue du club. Utilisez l'adresse donnée lors de l'inscription, ou contactez-nous par la rubrique ",
                 el('a', { href: PAGE_CONTACT, target: '_blank', rel: 'noopener' }, '« Nous contacter »'), ' du site du FC Gouesnou.');
      } else n.append(texte);
      n.hidden = false;
    }

    // ---------- Connexion ----------
    const params = new URLSearchParams(location.search + '&' + location.hash.replace(/^#/, ''));
    if (params.get('error_description')) erreurConnexion(messageErreur({ message: params.get('error_description') }));

    $('btnGoogle').addEventListener('click', async () => {
      erreurConnexion('');
      const { error } = await sb.auth.signInWithOAuth({ provider: 'google',
        options: { redirectTo: ADRESSE_APPLI, queryParams: { hd: 'fcgouesnou.com', prompt: 'select_account' } } });
      if (error) erreurConnexion(messageErreur(error));
    });
    $('formEmail').addEventListener('submit', async (e) => {
      e.preventDefault(); erreurConnexion('');
      const email = $('email').value.trim().toLowerCase();
      $('btnCode').disabled = true;
      const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: true } });
      $('btnCode').disabled = false;
      if (error) { erreurConnexion(messageErreur(error)); return; }
      emailEnCours = email;
      $('infoCode').textContent = 'Un code a été envoyé à ' + email + '. Pensez à regarder dans les courriers indésirables.';
      $('code').value = ''; $('choixConnexion').hidden = true; $('saisieCode').hidden = false; $('code').focus();
    });
    $('formCode').addEventListener('submit', async (e) => {
      e.preventDefault(); erreurConnexion('');
      $('btnValider').disabled = true;
      const { error } = await sb.auth.verifyOtp({ email: emailEnCours, token: $('code').value.replace(/\D/g, ''), type: 'email' });
      $('btnValider').disabled = false;
      if (error) erreurConnexion(messageErreur(error)); else emailEnCours = '';
    });
    $('btnRetour').addEventListener('click', () => { emailEnCours = ''; erreurConnexion(''); $('saisieCode').hidden = true; $('choixConnexion').hidden = false; });
    $('btnSortir').addEventListener('click', async () => {
      try { const sub = await abonnementActuel(); if (sub) await sbReel.from('appareils').delete().eq('endpoint', sub.endpoint); } catch (e) {}
      await sb.auth.signOut();
    });
    $('btnActualiser').addEventListener('click', () => { charger(); majCarteSportEasy(); });

    // ---------- Chargement des données ----------
    async function charger() {
      const uid = session.user.id;
      let fiches = null;
      if (AP.actif) fiches = AP.actif.fiches;
      else {
        const { data, error: e1 } = await sb.from('personnes').select('id, prenom, nom, annee_naissance, club_id').eq('user_id', uid);
        if (e1) { toast('Erreur de chargement : ' + e1.message); return; }
        fiches = data;
      }
      E.fiches = fiches || [];
      E.personnes = new Map(E.fiches.map(p => [p.id, { ...p, moi: true }]));
      E.repondPour = new Set(E.fiches.filter(p => age(p) === null || age(p) >= 18).map(p => p.id));

      if (AP.actif) {
        for (const x of AP.actif.enfants) { E.personnes.set(x.id, { ...x, enfant: true }); E.repondPour.add(x.id); }
      } else if (E.fiches.length) {
        const ids = E.fiches.map(p => p.id);
        const { data: enfants } = await sb.from('liens_famille')
          .select('enfant_id, enfant:personnes!liens_famille_enfant_id_fkey(id, prenom, nom, annee_naissance, club_id)')
          .in('parent_id', ids);
        for (const l of enfants || []) if (l.enfant) { E.personnes.set(l.enfant.id, { ...l.enfant, enfant: true }); E.repondPour.add(l.enfant.id); }
      }

      const [{ data: mesEq }, { data: coachEq }] = await Promise.all([sb.rpc('mes_equipes'), sb.rpc('equipes_coachees')]);
      E.coachees = new Set(coachEq || []);
      E.miennes = new Set(mesEq || []);
      const idsEq = [...new Set([...(mesEq || []), ...(coachEq || [])])];
      E.equipes = new Map();
      if (idsEq.length) {
        const { data: eqs } = await sb.from('equipes').select('id, nom, categorie, club_id, sous_groupes').in('id', idsEq);
        for (const q of eqs || []) E.equipes.set(q.id, q);
      }

      E.evenements = []; E.convocations = []; E.resumes = new Map(); E.covoit = new Map();
      if (idsEq.length) {
        const depuis = new Date(Date.now() - 3 * 3600 * 1000).toISOString();
        const jusqua = new Date(Date.now() + 28 * 86400 * 1000).toISOString();
        const { data: evts } = await sb.from('evenements').select('*, terrain:terrains(lat, lon)').in('equipe_id', idsEq).gte('debut', depuis).lte('debut', jusqua).order('debut').limit(150);
        // Les sondages SportEasy annulés (« Présence des joueurs ») ne sont pas affichés
        E.evenements = (evts || []).filter(e => !(e.etat === 'annule' && e.type === 'autre' && e.source_uid));
        const idsEvt = E.evenements.map(e => e.id);
        const idsPers = [...E.personnes.keys()];
        if (idsEvt.length && idsPers.length) {
          const { data: cv } = await sb.from('convocations').select('evenement_id, personne_id, reponse, motif').in('evenement_id', idsEvt).in('personne_id', idsPers);
          E.convocations = cv || [];
        }
        await Promise.all(idsEvt.map(async (id) => {
          const { data } = await sb.rpc('convocations_evenement', { ev: id });
          let lignes = data || [];
          // En aperçu, la personne observée ne voit les réponses que si elle coache l'équipe, est au CODIR
          // ou si le club laisse les familles voir les réponses
          if (AP.actif) {
            const evt = E.evenements.find(x => x.id === id);
            const voit = AP.actif.familles_voient_reponses || E.coachees.has(evt && evt.equipe_id) || AP.actif.roles.some(r => r.role === 'codir');
            if (!voit) lignes = lignes.map(l => ({ ...l, reponse: null }));
          }
          E.resumes.set(id, lignes);
        }));
        await chargerCovoit();
      }
      afficher();
    }

    // ---------- Affichage ----------
    let vue = 'avenir';
    let P = null, partenairesOk = false;
    async function preparerPartenaires() {
      if (!P) P = initPartenaires({ sb, el, toast });
      partenairesOk = await P.initialiser();
      document.querySelector('.onglet[data-vue="partenaires"]').hidden = !partenairesOk;
      afficher();
    }
    function afficher() {
      const moi = E.fiches[0];
      $('bonjour').textContent = moi ? 'Bonjour ' + moi.prenom + '.' : 'Bonjour.';
      const coach = E.coachees.size > 0;
      document.querySelector('.onglet[data-vue="coach"]').hidden = !coach;
      $('onglets').hidden = !coach && !partenairesOk;
      $('btnNouvel').hidden = !coach || vue !== 'coach';
      $('vueAvenir').hidden = vue !== 'avenir';
      $('vueCoach').hidden = vue !== 'coach';
      $('vuePartenaires').hidden = vue !== 'partenaires';
      afficherAvenir();
      if (coach) afficherCoach();
    }
    for (const b of document.querySelectorAll('#onglets .onglet')) b.addEventListener('click', () => {
      vue = b.dataset.vue;
      document.querySelectorAll('#onglets .onglet').forEach(x => x.classList.toggle('actif', x === b));
      afficher();
      if (vue === 'partenaires' && P) P.afficher($('vuePartenaires'));
    });

    function pastilles(evt) {
      const t = evt.type === 'match' || evt.type === 'tournoi' ? 'p-match' : evt.type === 'entrainement' ? 'p-entrainement' : 'p-autre';
      const r = [el('span', { class: 'pastille ' + t }, LIB_TYPE[evt.type] || 'Événement')];
      if (estMatch(evt) && avecGroupes(evt.equipe_id))
        r.push(evt.groupe ? el('span', { class: 'pastille p-groupe' }, 'Équipe ' + evt.groupe) : el('span', { class: 'pastille p-sansgroupe' }, 'Équipe à choisir'));
      if (evt.etat === 'annule') r.push(el('span', { class: 'pastille p-annule' }, 'Annulé'));
      else if (evt.etat === 'modifie') r.push(el('span', { class: 'pastille p-modifie' }, 'Modifié'));
      return r;
    }
    function titre(evt) {
      const eq = E.equipes.get(evt.equipe_id);
      if (evt.type === 'match' || evt.type === 'tournoi')
        return (eq ? eq.nom : '') + (evt.adversaire ? (evt.domicile === false ? ' chez ' : ' contre ') + evt.adversaire : '') + (evt.titre ? ' - ' + evt.titre : '');
      return (evt.titre || LIB_TYPE[evt.type]) + (eq ? ' - ' + eq.nom : '');
    }
    function details(evt) {
      const l = [];
      let h = sansHeure(evt) ? 'Horaire à confirmer' : heure(evt.debut) + (evt.fin ? ' à ' + heure(evt.fin) : '');
      if (evt.rendez_vous) h += ' (rendez-vous ' + heure(evt.rendez_vous) + ')';
      l.push(h);
      if (evt.lieu || evt.adresse) l.push([evt.lieu, evt.adresse].filter(Boolean).join(', '));
      const dest = evt.terrain && evt.terrain.lat ? evt.terrain.lat + ',' + evt.terrain.lon : [evt.lieu, evt.adresse].filter(Boolean).join(', ');
      if (dest && evt.etat !== 'annule')
        l.push(el('a', { class: 'itineraire', target: '_blank', rel: 'noopener',
          href: 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(dest) }, 'Itinéraire'));
      return l;
    }
    function compteur(evt) {
      const r = E.resumes.get(evt.id) || [];
      if (!r.length) return null;
      const n = { present: 0, absent: 0, incertain: 0, sans_reponse: 0 };
      for (const x of r) if (x.reponse) n[x.reponse]++;
      return el('div', { class: 'compteur' },
        el('span', { class: 'c-present' }, n.present + ' présent' + (n.present > 1 ? 's' : '')),
        el('span', { class: 'c-absent' }, n.absent + ' absent' + (n.absent > 1 ? 's' : '')),
        n.incertain ? el('span', { class: 'c-incertain' }, n.incertain + ' incertain' + (n.incertain > 1 ? 's' : '')) : null,
        el('span', { class: 'c-sans' }, n.sans_reponse + ' sans réponse'));
    }
    function listeConvoques(evt) {
      const r = E.resumes.get(evt.id) || [];
      if (!r.length) return null;
      const lib = { present: 'Présent', absent: 'Absent', incertain: 'Incertain', sans_reponse: 'Sans réponse' };
      return el('details', { class: 'details-liste' }, el('summary', {}, 'Voir les convoqués (' + r.length + ')'),
        r.map(x => el('div', { class: 'ligne-joueur' }, el('span', {}, x.prenom + ' ' + x.initiale + '.'), el('span', {}, lib[x.reponse] || '-'))));
    }

    function blocReponse(evt, cv) {
      const p = E.personnes.get(cv.personne_id);
      const peut = E.repondPour.has(cv.personne_id) && evt.etat !== 'annule';
      const nom = p ? (p.moi ? 'Moi' : p.prenom) : '';
      const tard = evt.date_limite && new Date(evt.date_limite) < new Date();
      const bloc = el('div', { class: 'personne' },
        el('div', { class: 'personne-nom' }, el('span', {}, nom),
          tard && cv.reponse === 'sans_reponse' ? el('span', { class: 'petit', style: 'color:var(--rouge)' }, 'Date limite dépassée') : null));
      const zone = el('div', { class: 'reponses' });
      for (const [val, lib] of [['present', 'Présent'], ['absent', 'Absent'], ['incertain', 'Incertain']]) {
        zone.append(el('button', { class: 'rep ' + val + (cv.reponse === val ? ' choisi' : ''), disabled: !peut,
          onclick: () => repondre(evt, cv, val, bloc) }, lib));
      }
      bloc.append(zone);
      if (!peut && evt.etat !== 'annule') bloc.append(el('div', { class: 'note' }, 'La réponse est donnée par un parent.'));
      if (cv.motif && (cv.reponse === 'absent' || cv.reponse === 'incertain')) bloc.append(el('div', { class: 'note' }, 'Motif : ' + cv.motif));
      return bloc;
    }

    async function repondre(evt, cv, val, bloc) {
      if (cv.reponse === val) return;
      const desistement = cv.reponse === 'present' && val !== 'present';
      const avant = cv.reponse;
      cv.reponse = val;
      const { error } = await sb.from('convocations').update({ reponse: val }).eq('evenement_id', evt.id).eq('personne_id', cv.personne_id);
      if (error) { cv.reponse = avant; toast('Réponse non enregistrée : ' + error.message); afficher(); return; }
      const r = (E.resumes.get(evt.id) || []);
      const { data } = await sb.rpc('convocations_evenement', { ev: evt.id }); E.resumes.set(evt.id, data || r);
      afficher();
      toast(desistement ? 'Désistement enregistré. Le coach le verra dans sa liste.' : 'Réponse enregistrée.');
      if (val !== 'present') demanderMotif(evt, cv);
    }

    function demanderMotif(evt, cv) {
      ouvrirFenetre('Motif (facultatif)', (f) => {
        const champ = el('input', { class: 'champ', placeholder: 'Ex. malade, vacances, examen', maxlength: 120, value: cv.motif || '' });
        f.append(el('p', { class: 'petit' }, 'Seul le coach voit le motif.'), champ,
          el('div', { class: 'boutons' },
            el('button', { class: 'btn secondaire', onclick: fermerFenetre }, 'Passer'),
            el('button', { class: 'btn principal', onclick: async () => {
              const motif = champ.value.trim() || null;
              const { error } = await sb.from('convocations').update({ motif }).eq('evenement_id', evt.id).eq('personne_id', cv.personne_id);
              if (error) { toast('Motif non enregistré : ' + error.message); return; }
              cv.motif = motif; fermerFenetre(); afficher(); toast('Motif enregistré.');
            } }, 'Enregistrer')));
        setTimeout(() => champ.focus(), 50);
      });
    }

    // ---------- Covoiturage (matchs et tournois) ----------
    const covoitPossible = (evt) => estMatch(evt) && evt.etat !== 'annule' && new Date(evt.debut) > new Date();
    async function chargerCovoit(ids) {
      const evs = ids || E.evenements.filter(covoitPossible).map(e => e.id);
      if (!evs.length) return;
      const { data, error } = await sb.rpc('covoiturage_evenements', { evs });
      if (error) return;
      for (const id of evs) E.covoit.set(id, []);
      for (const r of data || []) E.covoit.get(r.evenement_id).push(r);
    }
    const estMien = (pid) => E.personnes.has(pid);
    // Personnes de ma famille convoquées à l'événement, pour qui je peux réserver
    const mesConvoques = (evt) => E.convocations.filter(c => c.evenement_id === evt.id && E.repondPour.has(c.personne_id) && c.reponse !== 'absent')
      .map(c => E.personnes.get(c.personne_id)).filter(Boolean);
    // Adulte de la famille qui peut proposer sa voiture
    const conducteurs = () => E.fiches.filter(p => age(p) === null || age(p) >= 18);
    const placeDe = (evt, pid) => (E.covoit.get(evt.id) || []).find(o => o.sens === 'propose' && o.passagers.some(x => x.personne_id === pid));
    const telLien = (t) => t ? el('a', { href: 'tel:' + t.replace(/\s/g, '') }, t) : null;

    function blocCovoit(evt) {
      if (!covoitPossible(evt)) return null;
      const liste = E.covoit.get(evt.id) || [];
      const offres = liste.filter(o => o.sens === 'propose'), demandes = liste.filter(o => o.sens === 'cherche');
      const libres = offres.reduce((n, o) => n + Math.max(0, o.places - o.passagers.length), 0);
      const mes = mesConvoques(evt).map(p => { const o = placeDe(evt, p.id); return o ? p.prenom + ' monte avec ' + o.auteur : null; }).filter(Boolean);
      const mienne = offres.find(o => estMien(o.auteur_id));
      const aRepondre = mienne && mienne.designation === 'en_attente';
      const texte = el('div', { class: 'texte' },
        el('strong', {}, 'Covoiturage : '),
        offres.length ? libres + ' place' + (libres > 1 ? 's' : '') + ' libre' + (libres > 1 ? 's' : '') + ' dans ' + offres.length + ' voiture' + (offres.length > 1 ? 's' : '') : 'aucune voiture proposée',
        demandes.length ? ' · ' + demandes.length + ' demande' + (demandes.length > 1 ? 's' : '') : '',
        aRepondre ? el('div', { style: 'color:var(--orange);font-weight:600' }, 'Le coach vous désigne conducteur : réponse attendue')
          : mienne ? ' · vous conduisez (' + mienne.passagers.length + '/' + mienne.places + ')' : '',
        mes.length ? el('div', {}, mes.join(' ; ')) : null);
      return el('div', { class: 'covoit' }, texte, el('button', { class: 'mini', onclick: () => ouvrirCovoit(evt) }, 'Covoiturage'));
    }

    async function actionCovoit(evt, promesse, message) {
      const { error } = await promesse;
      if (error) { toast('Erreur : ' + (error.message || error)); return false; }
      await chargerCovoit([evt.id]);
      toast(message); afficher(); ouvrirCovoit(evt);
      return true;
    }

    function ouvrirCovoit(evt) {
      const liste = E.covoit.get(evt.id) || [];
      const offres = liste.filter(o => o.sens === 'propose'), demandes = liste.filter(o => o.sens === 'cherche');
      const famille = mesConvoques(evt);
      const sansPlace = famille.filter(p => !placeDe(evt, p.id));
      ouvrirFenetre('Covoiturage - ' + titre(evt), (f) => {
        f.append(el('p', { class: 'petit' }, jourDe(evt.debut) + (sansHeure(evt) ? '' : ', ' + heure(evt.debut)) + (evt.lieu ? ' - ' + evt.lieu : '') + '. Le téléphone du conducteur apparaît dès qu\'une place est réservée.'));
        f.append(el('div', { class: 'se-groupe' }, 'Voitures proposées (' + offres.length + ')'));
        if (!offres.length) f.append(el('p', { class: 'petit' }, 'Aucune voiture proposée pour le moment.'));
        for (const o of offres) {
          const libres = o.places - o.passagers.length;
          const moi = estMien(o.auteur_id);
          const b = el('div', { class: 'cv-bloc' },
            el('div', { class: 'cv-titre' }, el('span', {}, 'Voiture de ' + o.auteur, o.telephone ? ' · ' : '', telLien(o.telephone)),
              el('span', { class: libres > 0 ? 'libre' : 'plein' }, libres > 0 ? libres + ' place' + (libres > 1 ? 's' : '') + ' libre' + (libres > 1 ? 's' : '') : 'complet')),
            (o.depart || o.heure) ? el('div', { class: 'cv-info' }, 'Départ' + (o.depart ? ' : ' + o.depart : '') + (o.heure ? ', ' + heure(o.heure) : '')) : null,
            o.commentaire ? el('div', { class: 'cv-info' }, o.commentaire) : null,
            o.designe_par ? el('div', { class: 'cv-info', style: o.designation === 'en_attente' ? 'color:var(--orange)' : '' },
              'Désigné par ' + o.designe_par + (o.designation === 'en_attente' ? ' - réponse attendue' : ' - accepté')) : null);
          for (const x of o.passagers) {
            const retirable = moi || estMien(x.personne_id);
            b.append(el('div', { class: 'cv-passager' }, el('span', {}, x.nom, x.telephone ? ' · ' : '', telLien(x.telephone)),
              retirable ? el('button', { class: 'mini danger', onclick: () => {
                if (!confirm((estMien(x.personne_id) ? 'Libérer la place de ' : 'Retirer ') + x.nom + ' ?')) return;
                actionCovoit(evt, sb.from('covoiturage_passagers').delete().eq('offre_id', o.id).eq('personne_id', x.personne_id), 'Place libérée.');
              } }, estMien(x.personne_id) ? 'Libérer' : 'Retirer') : null));
          }
          const actions = el('div', { class: 'cv-actions' });
          const enAttente = o.designation === 'en_attente';
          if (enAttente && E.fiches.some(p => p.id === o.auteur_id)) {
            actions.append(el('button', { class: 'mini principal', onclick: () =>
              actionCovoit(evt, sb.rpc('covoit_repondre', { p_offre: o.id, p_accepte: true }), 'Merci ! Le coach est prévenu.') }, 'Accepter'));
            actions.append(el('button', { class: 'mini danger', onclick: () => {
              if (!confirm('Refuser de conduire pour ce match ? Le coach sera prévenu.')) return;
              actionCovoit(evt, sb.rpc('covoit_repondre', { p_offre: o.id, p_accepte: false }), 'Refus envoyé au coach.');
            } }, 'Refuser'));
          } else if (enAttente && E.coachees.has(evt.equipe_id)) {
            actions.append(el('button', { class: 'mini danger', onclick: () =>
              actionCovoit(evt, sb.rpc('covoit_annuler_designation', { p_offre: o.id }), 'Désignation retirée.') }, 'Retirer la désignation'));
          }
          if (!moi && libres > 0 && !enAttente) for (const p of sansPlace)
            actions.append(el('button', { class: 'mini principal', onclick: () =>
              actionCovoit(evt, sb.from('covoiturage_passagers').insert({ offre_id: o.id, personne_id: p.id }), 'Place réservée pour ' + p.prenom + '. Le conducteur est prévenu.') }, 'Réserver pour ' + p.prenom));
          if (moi && !enAttente) {
            actions.append(el('button', { class: 'mini', onclick: () => formulaireOffre(evt, o) }, 'Modifier'));
            actions.append(el('button', { class: 'mini danger', onclick: () => {
              if (!confirm('Supprimer votre proposition ?' + (o.passagers.length ? ' Les familles des passagers seront prévenues.' : ''))) return;
              actionCovoit(evt, sb.from('covoiturage').delete().eq('id', o.id), 'Proposition supprimée.');
            } }, 'Supprimer'));
          }
          if (actions.childNodes.length) b.append(actions);
          f.append(b);
        }
        f.append(el('div', { class: 'se-groupe' }, 'Places recherchées (' + demandes.length + ')'));
        if (!demandes.length) f.append(el('p', { class: 'petit' }, 'Aucune demande.'));
        for (const d of demandes) {
          const moi = estMien(d.auteur_id);
          f.append(el('div', { class: 'cv-bloc' },
            el('div', { class: 'cv-titre' }, el('span', {}, d.auteur + ' cherche une place', d.telephone ? ' · ' : '', telLien(d.telephone))),
            d.depart ? el('div', { class: 'cv-info' }, 'Depuis : ' + d.depart) : null,
            d.commentaire ? el('div', { class: 'cv-info' }, d.commentaire) : null,
            moi ? el('div', { class: 'cv-actions' }, el('button', { class: 'mini danger', onclick: () =>
              actionCovoit(evt, sb.from('covoiturage').delete().eq('id', d.id), 'Demande retirée.') }, 'Retirer la demande')) : null));
        }
        const boutons = el('div', { class: 'boutons', style: 'flex-wrap:wrap' });
        if (conducteurs().length && !offres.some(o => estMien(o.auteur_id)))
          boutons.append(el('button', { class: 'btn principal', onclick: () => formulaireOffre(evt, null) }, 'Je propose des places'));
        if (E.coachees.has(evt.equipe_id))
          boutons.append(el('button', { class: 'btn secondaire', onclick: () => formulaireDesignation(evt) }, 'Désigner un conducteur (coach)'));
        const aChercher = sansPlace.filter(p => !demandes.some(d => d.auteur_id === p.id));
        if (aChercher.length) boutons.append(el('button', { class: 'btn secondaire', onclick: () => formulaireDemande(evt, aChercher) }, 'Je cherche une place'));
        boutons.append(el('button', { class: 'btn secondaire', onclick: fermerFenetre }, 'Fermer'));
        f.append(boutons);
      });
    }

    async function formulaireDesignation(evt) {
      const { data, error } = await sb.rpc('covoit_candidats', { ev: evt.id });
      if (error) { toast('Erreur : ' + error.message); return; }
      const liste = (data || []).filter(c => !c.deja).sort((a, b) => a.nom.localeCompare(b.nom, 'fr', { sensitivity: 'base' }));
      ouvrirFenetre('Désigner un conducteur', (f) => {
        if (!liste.length) {
          f.append(el('p', { class: 'petit' }, 'Aucune personne disponible : les parents des joueurs convoqués et les coachs proposent déjà leur voiture, ou aucun parent n\'est rattaché.'),
            el('div', { class: 'boutons' }, el('button', { class: 'btn secondaire', onclick: () => ouvrirCovoit(evt) }, 'Retour')));
          return;
        }
        const qui = el('select', { class: 'champ' }, el('option', { value: '' }, 'Qui conduit ?'),
          liste.map(c => el('option', { value: c.personne_id }, c.nom + ' (' + [c.coach ? 'coach' : null, c.pour ? 'parent de ' + c.pour : null].filter(Boolean).join(', ') + ')')));
        const places = el('select', { class: 'champ' }, el('option', { value: '' }, 'Places libres pour d\'autres joueurs ?'),
          [1, 2, 3, 4, 5, 6, 7, 8].map(n => el('option', { value: n }, n + ' place' + (n > 1 ? 's' : '') + ' libre' + (n > 1 ? 's' : ''))));
        const depart = el('input', { class: 'champ', placeholder: 'Lieu de départ (facultatif)', maxlength: 120 });
        f.append(el('p', { class: 'petit' }, 'La personne reçoit une notification et accepte ou refuse ; vous êtes prévenu de sa réponse. Les familles ne peuvent réserver qu\'une fois la désignation acceptée.'),
          qui, places, depart,
          el('div', { class: 'boutons' },
            el('button', { class: 'btn secondaire', onclick: () => ouvrirCovoit(evt) }, 'Retour'),
            el('button', { class: 'btn principal', onclick: () => {
              if (!qui.value || !places.value) { toast('Choisissez la personne et le nombre de places.'); return; }
              actionCovoit(evt, sb.rpc('covoit_designer', { ev: evt.id, p_personne: qui.value, p_places: +places.value, p_depart: depart.value.trim() || null }),
                'Demande envoyée.');
            } }, 'Désigner')));
      });
    }

    function heureVersDate(evt, hhmm) {
      return hhmm ? new Date(cleJour(evt.debut) + 'T' + hhmm).toISOString() : null;
    }
    function formulaireOffre(evt, o) {
      const qui = conducteurs();
      ouvrirFenetre(o ? 'Modifier ma proposition' : 'Je propose des places', (f) => {
        const selQui = qui.length > 1 ? el('select', { class: 'champ' }, qui.map(p => el('option', { value: p.id }, p.prenom + ' ' + p.nom))) : null;
        const places = el('select', { class: 'champ' }, o ? null : el('option', { value: '', selected: true }, 'Places libres pour d\'autres joueurs ?'),
          [1, 2, 3, 4, 5, 6, 7, 8].map(n => el('option', { value: n, selected: o ? o.places === n : false }, n + ' place' + (n > 1 ? 's' : '') + ' libre' + (n > 1 ? 's' : '') + ' pour d\'autres joueurs')));
        const depart = el('input', { class: 'champ', placeholder: 'Lieu de départ (ex. parking du stade de Gouesnou)', maxlength: 120, value: o ? o.depart || '' : '' });
        const hDef = o && o.heure ? fmtHeure.format(new Date(o.heure)) : '';
        const h = el('input', { class: 'champ', type: 'time', value: hDef });
        const com = el('input', { class: 'champ', placeholder: 'Commentaire (facultatif)', maxlength: 200, value: o ? o.commentaire || '' : '' });
        f.append(el('p', { class: 'petit' }, 'Votre nom et vos places sont visibles par l\'équipe ; votre téléphone seulement par les familles des passagers et les coachs.'),
          ...(selQui ? [selQui] : []), places,
          el('p', { class: 'petit', style: 'margin:-6px 0 12px' }, 'Sans compter votre enfant : indiquez seulement les places que d\'autres joueurs peuvent réserver.'),
          depart, el('label', { class: 'petit' }, 'Heure de départ (facultatif)'), h, com,
          el('div', { class: 'boutons' },
            el('button', { class: 'btn secondaire', onclick: () => ouvrirCovoit(evt) }, 'Retour'),
            el('button', { class: 'btn principal', onclick: () => {
              if (!places.value) { toast('Choisissez le nombre de places.'); places.focus(); return; }
              const ligne = { places: +places.value, depart: depart.value.trim() || null, heure: heureVersDate(evt, h.value), commentaire: com.value.trim() || null };
              const req = o ? sb.from('covoiturage').update(ligne).eq('id', o.id)
                : sb.from('covoiturage').insert({ ...ligne, evenement_id: evt.id, sens: 'propose', personne_id: selQui ? selQui.value : qui[0].id });
              actionCovoit(evt, req, o ? 'Proposition modifiée.' : 'Merci ! Votre proposition est visible par l\'équipe.');
            } }, 'Enregistrer')));
      });
    }
    function formulaireDemande(evt, personnes) {
      ouvrirFenetre('Je cherche une place', (f) => {
        const selQui = el('select', { class: 'champ' }, personnes.map(p => el('option', { value: p.id }, p.prenom + ' ' + p.nom)));
        const depart = el('input', { class: 'champ', placeholder: 'Depuis (ex. Gouesnou, Guipavas)', maxlength: 120 });
        const com = el('input', { class: 'champ', placeholder: 'Commentaire (facultatif)', maxlength: 200 });
        f.append(el('p', { class: 'petit' }, 'La demande est visible par l\'équipe ; votre téléphone seulement par les conducteurs de ce match et les coachs.'),
          selQui, depart, com,
          el('div', { class: 'boutons' },
            el('button', { class: 'btn secondaire', onclick: () => ouvrirCovoit(evt) }, 'Retour'),
            el('button', { class: 'btn principal', onclick: () =>
              actionCovoit(evt, sb.from('covoiturage').insert({ evenement_id: evt.id, sens: 'cherche', personne_id: selQui.value, places: 1,
                depart: depart.value.trim() || null, commentaire: com.value.trim() || null }), 'Demande enregistrée.') }, 'Enregistrer')));
      });
    }

    function carteEvenement(evt, avecReponses) {
      const c = el('div', { class: 'evt' + (evt.etat === 'annule' ? ' annule' : '') },
        el('div', { class: 'evt-tete' }, el('div', { class: 'evt-titre' }, titre(evt)), ...pastilles(evt)),
        el('div', { class: 'evt-detail' }, details(evt).map(t => el('div', {}, t))),
        evt.consignes ? el('div', { class: 'consignes' }, evt.consignes) : null);
      if (avecReponses) for (const cv of E.convocations.filter(x => x.evenement_id === evt.id)) c.append(blocReponse(evt, cv));
      const cpt = compteur(evt); if (cpt) c.append(cpt);
      const cv = blocCovoit(evt); if (cv) c.append(cv);
      return c;
    }

    function afficherAvenir() {
      const zone = $('vueAvenir'); zone.replaceChildren();
      const mesEvt = new Set(E.convocations.map(c => c.evenement_id));
      const liste = E.evenements.filter(e => mesEvt.has(e.id) || (E.coachees.has(e.equipe_id) && E.miennes.has(e.equipe_id)));
      if (!E.fiches.length) { zone.append(el('p', { class: 'vide' }, "Votre compte n'est relié à aucune fiche du club. Contactez-nous par la rubrique « Nous contacter » du site.")); return; }
      if (!liste.length) { zone.append(el('p', { class: 'vide' }, 'Aucun événement à venir pour le moment.')); return; }
      let jour = '';
      for (const evt of liste) {
        const j = jourDe(evt.debut);
        if (j !== jour) { jour = j; zone.append(el('div', { class: 'jour' }, j)); }
        const c = carteEvenement(evt, true);
        const l = listeConvoques(evt); if (l) c.append(l);
        zone.append(c);
      }
    }

    // ---------- Vue coach ----------
    async function afficherCoach() {
      const zone = $('vueCoach'); zone.replaceChildren();
      const liste = E.evenements.filter(e => E.coachees.has(e.equipe_id));
      if (!liste.length) { zone.append(el('p', { class: 'vide' }, 'Aucun événement à venir. Créez-en un avec le bouton « + Nouvel événement ».')); return; }
      let jour = '';
      for (const evt of liste) {
        const j = jourDe(evt.debut);
        if (j !== jour) {
          jour = j; zone.append(el('div', { class: 'jour' }, j));
          // Un bouton « Composer » par équipe à sous-groupes qui a des matchs ce jour-là
          const ids = [...new Set(liste.filter(e => jourDe(e.debut) === j && estMatch(e) && e.etat !== 'annule' && avecGroupes(e.equipe_id)).map(e => e.equipe_id))];
          for (const id of ids) {
            const q = E.equipes.get(id);
            zone.append(el('button', { class: 'composer', onclick: () => composer(id, cleJour(evt.debut), j) },
              'Composer les équipes ' + q.sous_groupes.join(', ') + ' - ' + q.nom));
          }
        }
        const c = carteEvenement(evt, false);
        const det = el('details', { class: 'details-liste' }, el('summary', {}, 'Réponses détaillées'));
        det.addEventListener('toggle', async () => { if (det.open && det.children.length === 1) det.append(...await detailCoach(evt)); });
        const sansRep = (E.resumes.get(evt.id) || []).filter(x => x.reponse === 'sans_reponse').length;
        c.append(det, el('div', { class: 'actions-coach' },
          sansRep && evt.etat !== 'annule' ? el('button', { class: 'mini', onclick: () => relancer(evt, sansRep) }, 'Relancer les ' + sansRep + ' sans réponse') : null,
          el('button', { class: 'mini', onclick: () => formulaireEvenement(evt) }, 'Modifier'),
          evt.etat !== 'annule' ? el('button', { class: 'mini danger', onclick: () => annuler(evt) }, 'Annuler l\'événement') : null));
        zone.append(c);
      }
    }

    async function detailCoach(evt) {
      const { data, error } = await sb.from('convocations')
        .select('personne_id, reponse, motif, desiste_le, personne:personnes!convocations_personne_id_fkey(prenom, nom)')
        .eq('evenement_id', evt.id);
      if (error) return [el('p', { class: 'petit' }, 'Erreur : ' + error.message)];
      const ordre = { sans_reponse: 0, incertain: 1, absent: 2, present: 3 };
      const lib = { present: 'Présent', absent: 'Absent', incertain: 'Incertain', sans_reponse: 'Sans réponse' };
      return (data || []).sort((a, b) => ordre[a.reponse] - ordre[b.reponse] || a.personne.nom.localeCompare(b.personne.nom))
        .map(x => el('div', { class: 'ligne-joueur' },
          el('span', {}, x.personne.prenom + ' ' + x.personne.nom),
          el('span', {}, lib[x.reponse] + (x.desiste_le ? ' (désisté)' : '') + (x.motif ? ' - ' + x.motif : ''))));
    }

    async function relancer(evt, n) {
      if (!confirm('Envoyer un rappel aux ' + n + ' convoqués sans réponse (ou à leurs parents) ?')) return;
      const { data, error } = await sb.rpc('relancer_evenement', { p_evt: evt.id });
      if (error) { toast('Erreur : ' + error.message); return; }
      toast(data ? 'Rappel envoyé pour ' + data + ' convoqué' + (data > 1 ? 's' : '') + '.' : 'Rappel déjà envoyé il y a moins de 6 heures.');
    }

    async function annuler(evt) {
      if (!confirm('Annuler cet événement ? Les convoqués verront qu\'il est annulé.')) return;
      const { error } = await sb.from('evenements').update({ etat: 'annule' }).eq('id', evt.id);
      if (error) { toast('Erreur : ' + error.message); return; }
      toast('Événement annulé.'); charger();
    }

    // ---------- Composition des équipes A, B, C d'une journée ----------
    function composer(equipeId, jour, libJour) {
      const q = E.equipes.get(equipeId);
      ouvrirFenetre('Composer les équipes', async (f) => {
        f.append(el('p', { class: 'petit' }, q.nom + ' - ' + libJour));
        const attente = el('p', { class: 'petit' }, 'Chargement...'); f.append(attente);
        const { data, error } = await sb.rpc('composition_journee', { p_equipe: equipeId, p_jour: jour });
        attente.remove();
        if (error) { f.append(el('p', { class: 'erreur' }, 'Erreur : ' + error.message)); return; }
        const groupes = data.groupes || [];
        const evts = data.evenements || [];
        const lib = { present: 'présent', absent: 'absent', incertain: 'incertain', sans_reponse: 'sans réponse' };

        // 1. Équipe de chaque match
        const selGroupe = new Map();
        f.append(el('label', {}, 'Matchs du jour'));
        for (const ev of evts) {
          const s = el('select', { class: 'champ' }, el('option', { value: '' }, 'Équipe ?'),
            groupes.map(g => el('option', { value: g, selected: ev.groupe === g }, 'Équipe ' + g)));
          selGroupe.set(ev.id, s);
          const h = heure(ev.debut) === '00 h 00' ? '' : heure(ev.debut) + ' - ';
          f.append(el('div', { class: 'compo-match' },
            el('span', {}, h + (ev.adversaire ? (ev.domicile === false ? 'chez ' : 'contre ') + ev.adversaire : 'Match') + (ev.titre ? ' (' + ev.titre + ')' : '')), s));
        }

        // 2. Joueurs : A, B, C ou non retenu
        const choix = new Map((data.joueurs || []).map(j => [j.id, j.groupe || '']));
        const resume = el('div', { class: 'compteur compo-resume' });

    // ---------- Choix du lieu : commune puis terrain (référentiel Data ES) ----------
    let communesCache = null;
    async function listeCommunes() {
      if (!communesCache) { const { data } = await sb.rpc('communes_terrains'); communesCache = data || []; }
      return communesCache;
    }
    const libelleTerrain = (t) => [t.installation, t.terrain && t.terrain !== t.installation ? t.terrain : null].filter(Boolean).join(' - ')
      + (t.revetement ? ' (' + t.revetement.toLowerCase() + ')' : '');
    function choixLieu(evt) {
      const idListe = 'communes-' + Date.now();
      const datalist = el('datalist', { id: idListe });
      const commune = el('input', { class: 'champ', list: idListe, autocomplete: 'off', placeholder: 'Tapez le début du nom, ex. Plouzané' });
      const selTerrain = el('select', { class: 'champ' });
      const autre = el('input', { class: 'champ', placeholder: 'Ex. salle omnisports, ou lieu hors Finistère' });
      const blocTerrain = el('div', { hidden: true }, el('label', {}, 'Terrain'), selTerrain);
      const blocAutre = el('div', { hidden: true }, el('label', {}, 'Lieu (saisie libre)'), autre);
      let terrains = [];
      listeCommunes().then(cs => datalist.replaceChildren(...cs.map(c => el('option', { value: c.commune }))));

      async function chargerTerrains(code) {
        const nom = commune.value.trim();
        const c = (await listeCommunes()).find(x => x.commune.toLowerCase() === nom.toLowerCase());
        if (!c) { terrains = []; selTerrain.replaceChildren(); blocTerrain.hidden = true; blocAutre.hidden = !nom; return; }
        commune.value = c.commune;
        const { data } = await sb.from('terrains').select('code, installation, terrain, revetement, adresse, code_postal, commune')
          .eq('commune', c.commune).eq('actif', true).order('installation').order('terrain');
        terrains = data || [];
        selTerrain.replaceChildren(el('option', { value: '' }, 'Choisir un terrain'),
          ...terrains.map(t => el('option', { value: t.code, selected: t.code === code }, libelleTerrain(t))),
          el('option', { value: 'autre' }, 'Autre lieu dans cette commune'));
        if (terrains.length === 1 && !code) selTerrain.value = terrains[0].code;
        blocTerrain.hidden = false; blocAutre.hidden = selTerrain.value !== 'autre';
      }
      commune.addEventListener('change', () => chargerTerrains());
      selTerrain.addEventListener('change', () => { blocAutre.hidden = selTerrain.value !== 'autre'; if (!blocAutre.hidden) autre.focus(); });

      (async () => {
        if (evt && evt.terrain_code) {
          const { data: t } = await sb.from('terrains').select('commune').eq('code', evt.terrain_code).maybeSingle();
          if (t) { commune.value = t.commune; await chargerTerrains(evt.terrain_code); return; }
        }
        if (evt && evt.lieu) { autre.value = evt.lieu; blocAutre.hidden = false; return; }
        commune.value = 'Gouesnou'; await chargerTerrains();
      })();

      return {
        bloc: el('div', {}, el('label', {}, 'Commune'), commune, datalist, blocTerrain, blocAutre),
        // À domicile : Gouesnou par défaut ; à l'extérieur : commune vidée pour être saisie
        sens(domicile) {
          const nom = commune.value.trim().toLowerCase();
          if (!domicile && nom === 'gouesnou') { commune.value = ''; chargerTerrains(); commune.focus(); }
          if (domicile && !nom) { commune.value = 'Gouesnou'; chargerTerrains(); }
        },
        valeur() {
          const t = terrains.find(x => x.code === selTerrain.value);
          if (t) return { terrain_code: t.code, lieu: [t.installation, t.terrain && t.terrain !== t.installation ? t.terrain : null].filter(Boolean).join(' - '),
            adresse: [t.adresse, [t.code_postal, t.commune].filter(Boolean).join(' ')].filter(Boolean).join(', ') };
          const libre = autre.value.trim();
          const com = commune.value.trim();
          if (evt && libre && libre === evt.lieu && !evt.terrain_code) return { terrain_code: null, lieu: evt.lieu, adresse: evt.adresse || null };
          return { terrain_code: null, lieu: libre ? libre + (com && !libre.toLowerCase().includes(com.toLowerCase()) ? ', ' + com : '') : (com || null), adresse: null };
        }
      };
    }

        async function joueurs() {

          const { data } = await sb.from('membres_equipe').select('personne_id, role, personne:personnes(prenom, nom)').eq('equipe_id', selEq.value).eq('role', 'joueur');

        function maj() {

          if (matchGrp && !selGrp.children.length) selGrp.replaceChildren(...grp.map(g => el('option', { value: g }, 'Équipe ' + g)));
          blocSel.hidden = evt || t === 'entrainement' || matchGrp;
          note.hidden = evt || t !== 'entrainement';
          if (!blocSel.hidden && !choix.children.length) joueurs();
        }
        dom.addEventListener('change', () => lieu.sens(dom.value === 'true'));
        selType.addEventListener('change', maj); selEq.addEventListener('change', () => { choix.replaceChildren(); selGrp.replaceChildren(); maj(); });

        const enr = el('button', { class: 'btn principal' }, evt ? 'Enregistrer' : 'Créer et convoquer');
        f.append(el('label', {}, 'Équipe'), selEq, el('label', {}, 'Type'), selType,
          el('div', { class: 'deux' }, el('div', {}, el('label', {}, 'Début'), debut), el('div', {}, el('label', {}, 'Fin'), fin)),
          el('label', {}, 'Rendez-vous (facultatif)'), rdv, blocMatch, lieu.bloc,
          el('label', {}, 'Consignes (facultatif)'), consignes, blocGrp, blocSel, note,
          el('div', { class: 'boutons' }, el('button', { class: 'btn secondaire', onclick: fermerFenetre }, 'Fermer'), enr));
        maj();

        enr.addEventListener('click', async () => {
          if (!debut.value) { toast('Indiquez la date et l\'heure de début.'); return; }
          const t = selType.value;
          const ligne = { debut: versIso(debut.value), fin: versIso(fin.value), rendez_vous: versIso(rdv.value),
            ...lieu.valeur(), consignes: consignes.value.trim() || null,
            adversaire: (t === 'match' || t === 'tournoi') ? adv.value.trim() || null : null,
            domicile: (t === 'match' || t === 'tournoi') ? dom.value === 'true' : null };
          enr.disabled = true;
          if (evt) {
            const { error } = await sb.from('evenements').update(ligne).eq('id', evt.id);
            enr.disabled = false;
            if (error) { toast('Erreur : ' + error.message); return; }
            fermerFenetre(); toast('Événement modifié.'); charger(); return;
          }
          const avecGrp = !blocGrp.hidden;
          const { data: cree, error } = await sb.from('evenements').insert({ ...ligne, equipe_id: selEq.value, type: t, groupe: avecGrp ? selGrp.value : null }).select('id').single();
          if (error) { enr.disabled = false; toast('Erreur : ' + error.message); return; }
          if (avecGrp) { enr.disabled = false; fermerFenetre(); toast('Match créé. Composez maintenant l\'équipe ' + selGrp.value + '.'); charger(); return; }

              if (e2) toast('Événement créé, mais convocations incomplètes : ' + e2.message);

          }
          enr.disabled = false; fermerFenetre(); toast('Événement créé et convocations envoyées dans l\'application.'); charger();

    // ---------- Application installable et notifications ----------
    const estIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const estInstallee = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
    const pushPossible = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
    let invitationInstall = null;
    let enregistrementSW = null;
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then(r => { enregistrementSW = r; if (session) majCarteNotif(); }).catch(() => {});
      navigator.serviceWorker.addEventListener('message', (e) => { if (e.data === 'actualiser' && session) charger(); });
    }
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); invitationInstall = e; if (session) majCarteNotif(); });

    async function abonnementActuel() {
      if (!pushPossible) return null;
      const r = enregistrementSW || await navigator.serviceWorker.ready;
      return r.pushManager.getSubscription();
    }
    function versOctets(b64) {
      const p = '='.repeat((4 - b64.length % 4) % 4);
      const brut = atob((b64 + p).replace(/-/g, '+').replace(/_/g, '/'));
      return Uint8Array.from([...brut].map(c => c.charCodeAt(0)));
    }
    async function enregistrer(sub) {
      const j = sub.toJSON();
      const { error } = await sb.rpc('enregistrer_appareil', { p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth });
      if (error) throw error;
    }
    async function activerNotifications(bouton) {
      bouton.disabled = true;
      try {
        const perm = await Notification.requestPermission();
        if (perm !== 'granted') { toast('Notifications refusées. Vous pourrez les autoriser plus tard dans les réglages.'); majCarteNotif(); return; }
        const { data: cle, error } = await sb.rpc('cle_notifications');
        if (error || !cle) throw error || new Error('clé indisponible');
        const r = enregistrementSW || await navigator.serviceWorker.ready;
        const sub = await r.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: versOctets(cle) });
        await enregistrer(sub);
        toast('Notifications activées sur cet appareil.');
      } catch (e) {
        toast('Activation impossible : ' + (e && e.message || e));
      }
      bouton.disabled = false;
      majCarteNotif();
    }
    let majNotifN = 0;
    async function majCarteNotif() {
      // Plusieurs appels peuvent se croiser (démarrage, connexion) : seul le dernier remplit la carte
      const n = ++majNotifN;
      const c = $('carteNotif');
      const pret = () => { if (n !== majNotifN) return false; c.replaceChildren(); c.className = 'carte-notif'; c.hidden = false; return true; };
      if (!pret()) return;
      if (AP.actif) { c.hidden = true; return; }
      const texte = (t, petit) => el('div', { class: 'texte' }, t, petit ? el('small', {}, petit) : null);
      if (estIOS && !estInstallee) {
        c.append(texte('Installez l\'application sur votre iPhone pour recevoir les notifications.',
          'Dans Safari, touchez le bouton Partager, puis « Sur l\'écran d\'accueil ». Ouvrez ensuite l\'Espace club depuis sa nouvelle icône.'));
        return;
      }
      if (!pushPossible) {
        if (invitationInstall) c.append(texte('Installez l\'application sur cet appareil.'), installer());
        else c.hidden = true;
        return;
      }
      if (Notification.permission === 'denied') {
        c.append(texte('Les notifications sont bloquées sur cet appareil.', 'Autorisez-les dans les réglages du navigateur pour le site fcgouesnou.github.io.'));
        return;
      }
      let sub = null; try { sub = await abonnementActuel(); } catch (e) {}
      if (!pret()) return;
      if (sub && Notification.permission === 'granted') {
        try { await enregistrer(sub); } catch (e) {}
        if (!pret()) return;
        c.classList.add('ok');
        c.append(texte('Notifications activées sur cet appareil.', 'Convocations, changements, relances et désistements. Rien entre 21 h et 8 h, sauf une annulation du jour.'),
          el('button', { class: 'mini', onclick: async () => {
            const { error } = await sb.rpc('notification_test');
            toast(error ? 'Erreur : ' + error.message : 'Notification de test envoyée : elle arrive dans la minute.');
          } }, 'Tester'));
        if (invitationInstall) c.append(installer());
        return;
      }
      const b = el('button', { class: 'mini', onclick: () => activerNotifications(b) }, 'Activer');
      c.append(texte('Recevez vos convocations et les changements de programme sur cet appareil.'), b);
      if (invitationInstall) c.append(installer());
    }

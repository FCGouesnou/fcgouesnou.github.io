<html lang="fr">
<head>

  <link rel="apple-touch-icon" href="icone-apple-180.png">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FC Gouesnou">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Barlow+Condensed:wght@600&family=Sora:wght@600;700;800&family=Bungee&display=swap" rel="stylesheet">
  <style>
    :root { --bleu: #1a3a8f; --bleu-clair: #e8eefb; --texte: #1d2433; --gris: #6b7280; --gris-clair: #eef0f4;
            --rouge: #b42318; --rouge-clair: #fdecea; --vert: #067647; --vert-clair: #e7f6ec; --orange: #b54708; --orange-clair: #fef4e6; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, system-ui, sans-serif; color: var(--texte); background: #f5f7fb; }
    button, input, select, textarea { font: inherit; }
    [hidden] { display: none !important; }

    /* Connexion */
    .centre { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .carte-connexion { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(26,58,143,.12); padding: 32px 28px; width: 100%; max-width: 380px; text-align: center; }
    .logo-connexion { width: 96px; height: 96px; display: block; margin: 0 auto 12px; }
    .logo-entete { width: 34px; height: 34px; background: #fff; border-radius: 50%; padding: 2px; }
    h1 { font-family: "Barlow Condensed", sans-serif; font-weight: 600; color: var(--bleu); font-size: 2rem; margin: 0 0 4px; }
    .sous-titre { color: var(--gris); margin: 0 0 28px; }
    .btn { width: 100%; border: 0; border-radius: 10px; padding: 14px; font-weight: 600; cursor: pointer; }
    .btn:disabled { opacity: .6; cursor: wait; }
    .principal { background: var(--bleu); color: #fff; }
    .secondaire { background: var(--bleu-clair); color: var(--bleu); }
    .lien { background: none; border: 0; color: var(--gris); font-size: .9rem; padding: 10px; cursor: pointer; }
    .champ { width: 100%; border: 1px solid #cfd6e4; border-radius: 10px; padding: 13px; margin-bottom: 12px; background: #fff; }
    .champ:focus { outline: 2px solid var(--bleu); border-color: transparent; }
    #code { text-align: center; font-size: 1.5rem; letter-spacing: 6px; font-weight: 600; }
    .separateur { display: flex; align-items: center; gap: 10px; color: var(--gris); font-size: .85rem; margin: 22px 0; }
    .separateur::before, .separateur::after { content: ""; flex: 1; height: 1px; background: #e2e6ef; }
    .info { color: var(--vert); font-size: .9rem; margin: 0 0 14px; }
    .erreur { color: var(--rouge); margin-top: 16px; font-size: .9rem; }
    .erreur a { color: var(--rouge); }
    .petit { color: var(--gris); font-size: .8rem; }

    /* Application */
    .entete { position: sticky; top: 0; z-index: 5; background: var(--bleu); color: #fff; padding: 12px 16px calc(12px) ; display: flex; align-items: center; gap: 12px; }
    .entete h2 { font-family: "Barlow Condensed", sans-serif; font-weight: 600; font-size: 1.5rem; margin: 0; flex: 1; }
    .entete button { background: rgba(255,255,255,.15); color: #fff; border: 0; border-radius: 8px; padding: 8px 12px; cursor: pointer; font-size: .85rem; }
    .contenu { max-width: 640px; margin: 0 auto; padding: 16px 12px 96px; }
    .onglets { display: flex; gap: 8px; margin-bottom: 14px; }
    .onglet { flex: 1; border: 0; background: #fff; border-radius: 10px; padding: 10px; color: var(--gris); font-weight: 600; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
    .onglet.actif { background: var(--bleu); color: #fff; }
    .bonjour { color: var(--gris); margin: 4px 4px 14px; font-size: .95rem; }
    .vide { text-align: center; color: var(--gris); padding: 40px 12px; }
    .jour { font-weight: 600; color: var(--gris); font-size: .85rem; margin: 18px 4px 8px; }
    .evt { background: #fff; border-radius: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06); padding: 14px; margin-bottom: 10px; }
    .evt.annule { opacity: .65; }
    .evt-tete { display: flex; gap: 10px; align-items: flex-start; }
    .pastille { font-size: .72rem; font-weight: 600; border-radius: 6px; padding: 3px 7px; white-space: nowrap; }
    .p-match { background: var(--orange-clair); color: var(--orange); }
    .p-entrainement { background: var(--bleu-clair); color: var(--bleu); }
    .p-autre { background: var(--gris-clair); color: var(--gris); }
    .p-annule { background: var(--rouge-clair); color: var(--rouge); }
    .p-modifie { background: var(--orange-clair); color: var(--orange); }
    .p-groupe { background: var(--bleu); color: #fff; }
    .p-sansgroupe { background: var(--gris-clair); color: var(--gris); }
    .composer { width: 100%; margin: 0 0 10px; border: 1.5px dashed var(--bleu); background: var(--bleu-clair); color: var(--bleu); border-radius: 12px; padding: 11px; font-weight: 600; cursor: pointer; }
    .compo-match { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--gris-clair); font-size: .88rem; }
    .compo-match span { flex: 1; }
    .compo-match select { width: auto; margin: 0; padding: 7px; }
    .compo-joueur { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--gris-clair); }
    .compo-joueur .nom { flex: 1; font-size: .92rem; }
    .compo-joueur .nom small { display: block; color: var(--gris); font-size: .75rem; }
    .seg { display: flex; gap: 4px; }
    .seg button { min-width: 36px; border: 1.5px solid #d5dbe7; background: #fff; border-radius: 8px; padding: 7px 0; font-weight: 600; cursor: pointer; color: var(--texte); }
    .seg button.choisi { background: var(--bleu); border-color: var(--bleu); color: #fff; }
    .seg button.aucun.choisi { background: var(--gris); border-color: var(--gris); }
    /* Partenaires */
    .fenetre.large { max-width: 860px; }
    .bandeau-apercu { background: #fff4e0; border: 2px solid #e8a33a; border-radius: 14px; padding: 12px 14px; margin-bottom: 14px; font-size: .88rem; }
    .bandeau-apercu .ligne-titre { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    .bandeau-apercu strong { color: #8a4b00; }
    .bandeau-apercu ul { margin: 8px 0 0; padding-left: 18px; color: var(--texte); }
    .liste-apercu { display: grid; gap: 6px; margin-top: 10px; max-height: 50vh; overflow: auto; }
    .p-tuiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 8px 0 14px; }
    .p-tuile { background: #fff; border: 0; border-radius: 12px; padding: 10px 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06); text-align: left; color: var(--texte); font: inherit; }
    .p-tuile.p-cliquable { cursor: pointer; }
    .p-tuile strong { display: block; font-size: 1.2rem; color: var(--bleu); }
    .p-tuile span { display: block; font-size: .8rem; color: var(--gris); }
    .p-tuile small { display: block; font-size: .74rem; color: var(--gris); margin-top: 4px; }
    .p-tuile-large { grid-column: 1 / -1; }
    .p-jauge { height: 8px; background: #e6e9f2; border-radius: 4px; margin-top: 8px; overflow: hidden; }
    .p-jauge div { height: 100%; background: var(--bleu); border-radius: 4px; }
    .p-evo { display: flex; gap: 10px; align-items: flex-end; height: 170px; background: #fff; border-radius: 12px; padding: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    .p-evo-col { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; font-size: .74rem; color: var(--gris); }
    .p-evo-barres { flex: 1; width: 100%; display: flex; gap: 3px; align-items: flex-end; justify-content: center; }
    .p-evo-barres div { width: 40%; max-width: 26px; border-radius: 4px 4px 0 0; }
    .p-evo-att { background: #c9d1e6; } .p-evo-rec { background: var(--bleu); }
    .p-leg { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: middle; }
    .p-bloc-tb { margin-top: 10px; } .p-bloc-tb .p-ligne { margin-top: 6px; }
    .p-docs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 10px; }
    .p-resume { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-bottom: 12px; }
    .p-resume div { background: #fff; border-radius: 12px; padding: 10px 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    .p-resume strong { display: block; font-size: 1.15rem; color: var(--bleu); }
    .p-resume span { font-size: .78rem; color: var(--gris); }
    .p-barre { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
    .p-barre .champ { flex: 1; min-width: 180px; margin: 0; }
    .p-liste { display: flex; flex-direction: column; gap: 6px; }
    .p-ligne { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; text-align: left; width: 100%; border: 0; background: #fff; border-radius: 12px; padding: 11px 13px; box-shadow: 0 1px 3px rgba(0,0,0,.06); cursor: pointer; color: var(--texte); }
    .p-ligne-nom { font-weight: 600; }
    .p-ligne-nom small { display: block; font-weight: 400; color: var(--gris); font-size: .78rem; }
    .p-ligne-info { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .p-marque { display: inline-block; background: var(--orange-clair); color: var(--orange); border-radius: 6px; padding: 2px 7px; font-size: .75rem; margin: 4px 4px 0 0; }
    .p-onglets { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0; }
    .p-onglets .onglet { flex: none; padding: 8px 12px; font-size: .85rem; background: var(--gris-clair); }
    .p-onglets .onglet.actif { background: var(--bleu); }
    .p-contrat { border: 1px solid #e2e6ef; border-radius: 12px; padding: 10px 12px; margin: 10px 0; }
    .p-contrat-tete { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .p-contrat-tete .petit { flex: 1; }
    .p-echeance { border-top: 1px solid var(--gris-clair); padding: 8px 0; }
    .p-echeance-tete { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .p-echeance-tete > span:first-child { flex: 1; }
    .p-paiement { display: flex; gap: 8px; justify-content: space-between; align-items: center; flex-wrap: wrap; font-size: .85rem; padding: 6px 0 6px 10px; border-left: 3px solid var(--bleu-clair); margin: 6px 0; }
    .p-paiement > span:first-child { flex: 1; }
    .p-boutons { display: flex; gap: 6px; flex-wrap: wrap; }
    .p-deux { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
    .p-bloc { display: block; color: var(--gris); white-space: pre-wrap; margin-top: 3px; }
    .p-titre { margin: 18px 0 4px; color: var(--bleu); }
    .p-case { display: flex !important; gap: 8px; align-items: center; color: var(--texte) !important; margin: 4px 0 10px; }
    .p-champ .champ { margin-bottom: 10px; }
    a.mini { text-decoration: none; display: inline-block; }
    .itineraire { color: var(--bleu); font-weight: 500; text-decoration: none; }
    .compo-resume { position: sticky; top: -20px; background: #fff; padding: 8px 0; z-index: 1; }
    .evt-titre { font-weight: 600; flex: 1; }
    .evt-detail { color: var(--gris); font-size: .88rem; margin-top: 4px; line-height: 1.45; }
    .consignes { background: var(--gris-clair); border-radius: 8px; padding: 8px 10px; font-size: .85rem; margin-top: 8px; white-space: pre-wrap; }
    .personne { border-top: 1px solid var(--gris-clair); margin-top: 12px; padding-top: 10px; }
    .personne-nom { font-size: .88rem; font-weight: 500; margin-bottom: 8px; display: flex; justify-content: space-between; gap: 8px; }
    .reponses { display: flex; gap: 6px; }
    .rep { flex: 1; border: 1.5px solid #d5dbe7; background: #fff; border-radius: 10px; padding: 10px 4px; font-weight: 600; font-size: .88rem; cursor: pointer; color: var(--texte); }
    .rep.present.choisi { background: var(--vert); border-color: var(--vert); color: #fff; }
    .rep.absent.choisi { background: var(--rouge); border-color: var(--rouge); color: #fff; }
    .rep.incertain.choisi { background: var(--orange); border-color: var(--orange); color: #fff; }
    .rep:disabled { cursor: default; opacity: .55; }
    .motif { display: flex; gap: 6px; margin-top: 8px; }
    .motif input { flex: 1; margin: 0; padding: 9px; }
    .motif button { border: 0; background: var(--bleu); color: #fff; border-radius: 8px; padding: 0 12px; cursor: pointer; }

    /* Fenêtre */
    .voile { position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
    .fenetre { background: #fff; width: 100%; max-width: 560px; max-height: 92vh; overflow: auto; border-radius: 18px 18px 0 0; padding: 20px 18px calc(20px + env(safe-area-inset-bottom)); }

    .fenetre h3 { margin: 0 0 14px; font-family: "Barlow Condensed", sans-serif; font-weight: 600; font-size: 1.5rem; color: var(--bleu); }
    .fenetre label { display: block; font-size: .82rem; font-weight: 600; color: var(--gris); margin-bottom: 4px; }
    .deux { display: flex; gap: 10px; } .deux > div { flex: 1; }
    .choix-joueurs { max-height: 240px; overflow: auto; border: 1px solid #e2e6ef; border-radius: 10px; padding: 6px 10px; margin-bottom: 12px; }
    .choix-joueurs label { display: flex; gap: 8px; align-items: center; color: var(--texte); font-weight: 400; font-size: .92rem; padding: 6px 0; margin: 0; }
    .boutons { display: flex; gap: 8px; margin-top: 6px; }
    .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom)); background: #1d2433; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: .9rem; z-index: 30; max-width: 90vw; }

    /* ===== Look « Nuit de match » (0.16) : habillage commun ===== */
    :root { --nuit: #0a1638; --marine: #10235c; --neon: #7cc4ff; --soleil: #ffd45c; }
    body { background: #f2f5fb; }
    .titre-sora, .evt-titre, .fm-titre, .jour, .bonjour strong { font-family: Sora, Inter, sans-serif; }
    /* Bandeau d'en-tête : stade de nuit, lignes du terrain en filigrane */
    .entete { position: relative; background:
        radial-gradient(120% 140% at 85% -30%, #2b55c9 0%, var(--marine) 48%, var(--nuit) 100%);
      padding: calc(16px + env(safe-area-inset-top)) 16px 64px; overflow: hidden; z-index: 0; }
    .entete::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .11;
      background:
        radial-gradient(circle at 50% 120%, transparent 58px, #fff 59px, #fff 60.5px, transparent 61.5px),
        linear-gradient(#fff, #fff) 50% 0 / 1.5px 100% no-repeat,
        linear-gradient(#fff, #fff) 0 18px / 100% 1.5px no-repeat; }
    .entete > * { position: relative; }
    .entete h2 { flex: 1; min-width: 0; font-family: Bungee, sans-serif; font-weight: 400; font-size: 1.15rem; color: #e9f5ff; letter-spacing: .3px;
      text-shadow: 0 0 6px var(--neon), 0 0 18px #3d8bff, 0 0 32px #2b55c9; }
    .entete h2 small { display: block; font-family: Inter, sans-serif; font-size: .72rem; color: #a9c2ff; text-shadow: none; letter-spacing: 0; margin-top: 2px; }
    .logo-entete { width: 42px; height: 42px; box-shadow: 0 0 0 3px rgba(124,196,255,.35); }
    .entete button { border-radius: 12px; min-height: 40px; background: rgba(255,255,255,.13); }
    .entete button:hover { background: rgba(255,255,255,.22); }
    .contenu { margin-top: -60px; position: relative; z-index: 1; padding-top: 0; }
    .bonjour { color: #fff; font-size: 1rem; margin: 0 4px 16px; text-shadow: 0 1px 8px rgba(10,22,56,.5); }
    /* Onglets en pastilles */
    .onglets { background: #fff; padding: 6px; border-radius: 18px; box-shadow: 0 10px 28px rgba(16,35,92,.16); gap: 4px; overflow-x: auto; scrollbar-width: none; }
    .onglets::-webkit-scrollbar { display: none; }
    .onglet { flex: 1 0 auto; white-space: nowrap; box-shadow: none; border-radius: 13px; min-height: 44px; padding: 10px 14px; font-family: Sora, Inter, sans-serif; font-size: .86rem; background: transparent; }
    .onglet.actif { background: var(--marine); box-shadow: 0 6px 16px rgba(16,35,92,.35); }
    /* Cartes */
    .evt { border-radius: 20px; padding: 16px; box-shadow: 0 6px 18px rgba(16,35,92,.08); }
    .evt-match { padding-top: 0; overflow: hidden; }
    .evt-match::before { content: "Match"; display: block; margin: 0 -16px 14px; padding: 9px 16px; font: 600 .74rem Inter, sans-serif;
      color: #fff; background: linear-gradient(90deg, var(--marine), #1d3f9e); letter-spacing: .2px; }
    .evt-match.domicile::before { content: "Match à domicile"; }
    .evt-match.exterieur::before { content: "Match à l'extérieur"; }
    .evt-titre { font-weight: 700; font-size: 1rem; line-height: 1.3; }
    .jour { color: var(--marine); font-weight: 700; font-size: .9rem; margin: 22px 4px 10px; }
    .pastille { border-radius: 999px; padding: 4px 9px; }
    .evt-match .p-match { display: none; }
    /* Réponses : grands boutons lumineux */
    .rep { min-height: 48px; border-radius: 14px; border-width: 2px; font-family: Sora, Inter, sans-serif; font-weight: 700; font-size: .92rem; transition: transform .15s, box-shadow .15s; }
    .rep.present { color: #1f7a4a; border-color: #cdeedb; }
    .rep.absent { color: #b42328; border-color: #f7d2d3; }
    .rep.incertain { color: #8a5300; border-color: #fbe3b8; }
    .rep.present.choisi { background: #2fb36b; border-color: #2fb36b; box-shadow: 0 6px 16px rgba(47,179,107,.4); transform: scale(1.03); }
    .rep.absent.choisi { background: #e5484d; border-color: #e5484d; box-shadow: 0 6px 16px rgba(229,72,77,.35); transform: scale(1.03); }
    .rep.incertain.choisi { background: #f5a524; border-color: #f5a524; color: #3d2600; box-shadow: 0 6px 16px rgba(245,165,36,.4); transform: scale(1.03); }
    .compteur span { border-radius: 999px; padding: 4px 10px; font-weight: 600; }
    /* Boutons */
    .mini { border-radius: 11px; min-height: 36px; padding: 8px 12px; }
    .mini.principal, .btn.principal, .flottant { background: var(--marine); }
    .btn { border-radius: 14px; font-family: Sora, Inter, sans-serif; }
    .flottant { border-radius: 18px; box-shadow: 0 10px 26px rgba(16,35,92,.4); font-family: Sora, Inter, sans-serif; }
    .covoit { background: #f5f8fe; border-radius: 14px; padding: 10px 12px; }
    .carte-notif { border-radius: 18px; box-shadow: 0 6px 18px rgba(16,35,92,.08); }
    .fenetre { border-radius: 24px 24px 0 0; }
    @media (min-width: 640px) { .fenetre { border-radius: 24px; } }
    .fenetre h3 { font-family: Sora, Inter, sans-serif; font-weight: 700; font-size: 1.2rem; color: var(--marine); }

    /* En-tête : titre puis boutons sur téléphone, une seule ligne sur grand écran */
    .entete { flex-wrap: wrap; row-gap: 10px; }
    .entete h2 { flex: 1 1 calc(100% - 60px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: clamp(1rem, 4.6vw, 1.2rem); }
    .entete button { min-height: 36px; padding: 7px 12px; font-size: .82rem; }
    .entete #btnApercu { margin-left: auto; }
    @media (min-width: 760px) { .entete { flex-wrap: nowrap; padding-left: max(16px, calc((100vw - 1180px) / 2)); padding-right: max(16px, calc((100vw - 1180px) / 2)); }
      .entete h2 { flex: 1 1 auto; } .entete #btnApercu { margin-left: 0; } }
    .entete #btnActualiser.nouvelle-version { background: #ffcf4d; color: #10235c; font-weight: 700; box-shadow: 0 0 0 3px rgba(255,207,77,.35); }
    .tirer { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 6px); left: 50%; transform: translate(-50%, 0); z-index: 60; opacity: 0; pointer-events: none;
      background: var(--marine); color: #fff; padding: 8px 16px; border-radius: 999px; font-size: .85rem; font-weight: 600; box-shadow: 0 6px 18px rgba(16,35,92,.3); transition: opacity .15s; }
    .tirer.visible { opacity: 1; } .tirer.pret { background: #ffcf4d; color: #10235c; }
    .adm-jauge { flex: 0 0 120px; height: 10px; border-radius: 999px; background: #e8eefb; overflow: hidden; }
    .adm-jauge span { display: block; height: 100%; background: linear-gradient(90deg, #2f80ed, #10235c); }
    .adm-alerte { color: #c0392b; font-weight: 600; }
    .p-ligne-info small { display: block; text-align: right; }
    /* Fenêtres : défilement confiné, page derrière bloquée, croix toujours visible */
    body.modal-ouvert { position: fixed; left: 0; right: 0; overflow: hidden; }
    .voile { overscroll-behavior: contain; touch-action: none; }
    .fenetre { max-height: 92vh; max-height: 92dvh; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-y; position: relative; }
    .fenetre-barre { position: sticky; top: 0; height: 0; z-index: 6; }
    .fermer-x { position: absolute; right: -6px; top: 4px; width: 38px; height: 38px; border-radius: 50%; border: 0; background: #eef3fc; color: var(--marine);
      font-size: 1.5rem; line-height: 1; cursor: pointer; box-shadow: 0 2px 8px rgba(10,22,56,.15); display: flex; align-items: center; justify-content: center; }
    .fenetre > h3 { padding-right: 44px; }
    /* En-tête de carte : le titre garde une largeur lisible, les pastilles passent dessous si besoin */
    .evt-tete { flex-wrap: wrap; row-gap: 6px; }
    .evt-tete .evt-titre { flex: 1 1 240px; min-width: 0; }
    .rdv { display: flex; align-items: center; gap: 8px; margin: 8px 0 4px; padding: 9px 12px; border-radius: 12px; background: #e8f1ff; border: 1px solid #b9d4ff; color: var(--marine); font-size: .98rem; }
    .rdv strong { font-family: Sora, Inter, sans-serif; font-size: 1.1rem; } .rdv small { color: var(--gris); }
    .rdv-ico { font-size: 1.1rem; }
    .pastille.p-horaire { background: #fff1d6; color: #9a5b00; border: 1px solid #ffc861; font-weight: 700; }
    /* Direct du match et statistiques */
    .direct-carte .texte strong { color: var(--marine); }
    .direct-score { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; background: linear-gradient(135deg, #0a1638, #10235c); color: #fff; border-radius: 18px; padding: 16px 14px 12px; margin-bottom: 12px; text-align: center; }
    .direct-equipe { font-family: Sora, Inter, sans-serif; font-weight: 600; font-size: .95rem; line-height: 1.2; }
    .direct-chiffres { display: flex; gap: 8px; align-items: center; font-family: Bungee, Sora, sans-serif; }
    .direct-chiffres b { font-size: 2.4rem; color: #fff; text-shadow: 0 0 14px rgba(124,196,255,.7); }
    .direct-chiffres span { font-size: 1.6rem; color: #7cc4ff; }
    .direct-statut { grid-column: 1 / -1; font-size: .8rem; color: #b9d4ff; }
    .direct-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
    .direct-btn { border: 0; border-radius: 14px; min-height: 52px; font-weight: 700; font-size: .9rem; background: #eef3fc; color: var(--marine); cursor: pointer; }
    .direct-btn.direct-but { background: #2fb36b; color: #fff; } .direct-btn.direct-but_adverse { background: #e5484d; color: #fff; }
    .direct-btn.direct-jaune { background: #ffd43b; color: #3d2f00; } .direct-btn.direct-rouge { background: #c0392b; color: #fff; }
    .direct-fil { display: grid; gap: 6px; }
    .direct-ligne { display: grid; grid-template-columns: 44px 28px 1fr auto; align-items: center; gap: 8px; background: #fff; border: 1px solid #e3e9f6; border-radius: 12px; padding: 8px 10px; }
    .direct-minute { font-family: Sora, Inter, sans-serif; font-weight: 700; color: var(--marine); }
    .direct-icone { text-align: center; font-size: 1.1rem; }

    .direct-icone.jaune { background: #ffd43b; } .direct-icone.rouge { background: #e5484d; }
    .direct-texte { display: flex; flex-direction: column; } .direct-texte small { color: var(--gris); }
    .direct-l-but { border-left: 4px solid #2fb36b; } .direct-l-but_adverse { border-left: 4px solid #e5484d; }
    .direct-suppr { border: 0; background: transparent; color: #c0392b; font-size: 1.3rem; cursor: pointer; }
    .direct-form { display: grid; gap: 10px; }
    .direct-champ { display: grid; gap: 4px; font-size: .85rem; color: var(--gris); } .direct-champ .champ { margin: 0; }
    .direct-compo { flex-wrap: wrap !important; overflow: visible !important; }
    .stats-graphe { margin-top: 6px; }
    .stats-barre { display: grid; grid-template-columns: minmax(90px, 30%) 1fr 56px; align-items: center; gap: 8px; margin: 5px 0; font-size: .85rem; }
    .stats-nom { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stats-piste { height: 12px; background: #e8eefb; border-radius: 999px; overflow: hidden; }

    .stats-res { font-family: Sora, Inter, sans-serif; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: #eef1f7; color: var(--gris); }
    .stats-res.v { background: #e3f7ec; color: #1f8a4c; } .stats-res.n { background: #eef1f7; color: #4a5568; } .stats-res.d { background: #fde8e8; color: #c0392b; }
    /* Aide et RACI */

    .raci-lettre { flex: none; width: 22px; height: 22px; border-radius: 6px; color: #fff; font-weight: 700; font-size: .78rem; display: inline-flex; align-items: center; justify-content: center; }
    .raci-r { background: #10235c; } .raci-a { background: #c0392b; } .raci-c { background: #2f80ed; } .raci-i { background: #8a94a6; }
    .raci-precision { margin-top: 8px; }
    @media (max-width: 480px) { .raci-lignes { grid-template-columns: 1fr; } }
    /* Grand écran : plus large, cartes sur plusieurs colonnes */
    @media (min-width: 1000px) {
      .contenu { max-width: 1180px; padding-left: 20px; padding-right: 20px; }

    }
    /* Carte « Prochain match » */
    .hero { background: #fff; border-radius: 24px; box-shadow: 0 18px 40px rgba(16,35,92,.2); overflow: hidden; margin: 6px 0 8px; }
    .hero-bandeau { background: linear-gradient(90deg, var(--marine), #1d3f9e); color: #fff; padding: 11px 16px; display: flex; align-items: center; gap: 8px; font-size: .78rem; font-weight: 600; }

    img.hero-ecusson { background: #fff; padding: 2px; }
    .hero-vs { text-align: center; }
    .hero-vs b { display: block; font-family: Bungee, sans-serif; font-weight: 400; font-size: 1.35rem; color: var(--marine); }
    .hero-vs span { font-size: .72rem; color: var(--gris); }
    .hero-chips { display: flex; justify-content: center; gap: 8px; margin: 14px 0 4px; flex-wrap: wrap; }
    .hero-chip { background: #f2f5fb; border-radius: 12px; padding: 7px 12px; text-align: center; min-width: 60px; }
    .hero-chip b { display: block; font-family: Sora, Inter, sans-serif; font-weight: 800; font-size: 1.15rem; color: var(--marine); }
    .hero-chip span { font-size: .68rem; color: var(--gris); }
    a.hero-lieu { background: var(--marine); color: #fff; border-radius: 12px; padding: 7px 12px; display: flex; align-items: center; gap: 6px; font-size: .8rem; font-weight: 600; text-decoration: none; max-width: 100%; }
    a.hero-lieu span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hero-detail { text-align: center; color: var(--gris); font-size: .82rem; margin-top: 6px; }
    .hero-presence { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--gris-clair); }
    .hero-barre { flex: 1; }
    .hero-barre .barre { height: 8px; border-radius: 999px; background: #eef1f7; overflow: hidden; display: flex; }
    .hero-barre .barre span { height: 100%; }
    .hero-barre small { display: block; font-size: .74rem; color: var(--gris); margin-top: 5px; }

    /* ===== Look « Nuit de match » (0.18) : tous les écrans ===== */
    .p-titre, .se-groupe, .fm-section, .p-tuile strong, .p-resume strong, .p-ligne-nom, .fr-ligne .fr-tete { font-family: Sora, Inter, sans-serif; }

    .se-groupe, .fm-section { color: var(--marine); font-weight: 700; }
    /* Tuiles et chiffres clés */

    .p-tuile, .p-resume div { border-radius: 18px; padding: 14px 16px; box-shadow: 0 6px 18px rgba(16,35,92,.08); position: relative; overflow: hidden; }
    .p-tuile::after, .p-resume div::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 0; }
    .p-tuile strong, .p-resume strong { font-size: 1.45rem; font-weight: 800; color: var(--marine); letter-spacing: -.3px; }
    .p-tuile span, .p-resume span { font-weight: 500; }
    .p-tuile.p-cliquable { transition: transform .15s, box-shadow .15s; }
    .p-tuile.p-cliquable:hover { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(16,35,92,.16); }
    .p-tuile-large { background: radial-gradient(120% 160% at 90% -40%, #2b55c9 0%, var(--marine) 50%, var(--nuit) 100%); color: #fff; }
    .p-tuile-large strong { color: #fff; font-size: 1.8rem; }
    .p-tuile-large span, .p-tuile-large small { color: #c9d7ff; }
    .p-tuile-large .p-jauge { background: rgba(255,255,255,.15); }
    .p-jauge { height: 10px; border-radius: 999px; }
    .p-jauge div { border-radius: 999px; background: linear-gradient(90deg, #2fb36b, #3ee08b); box-shadow: 0 0 10px rgba(62,224,139,.5); }
    .p-evo { border-radius: 18px; box-shadow: 0 6px 18px rgba(16,35,92,.08); padding: 16px; }
    .p-evo-rec { background: linear-gradient(180deg, #3d6ee6, var(--marine)); }
    .p-evo-att { background: #d6def2; }
    /* Listes */
    .p-liste { gap: 8px; }
    .p-ligne { border-radius: 16px; padding: 13px 15px; box-shadow: 0 3px 10px rgba(16,35,92,.06); transition: transform .12s, box-shadow .12s; }
    button.p-ligne:hover, .p-ligne:hover { box-shadow: 0 8px 20px rgba(16,35,92,.12); }
    .p-ligne-nom { font-weight: 700; }
    .p-marque { border-radius: 999px; padding: 3px 9px; font-weight: 600; }
    .p-barre .champ { border-radius: 14px; }
    /* Onglets internes en segments */
    .p-onglets { background: #fff; padding: 5px; border-radius: 16px; box-shadow: 0 6px 18px rgba(16,35,92,.08); gap: 4px; display: inline-flex; flex-wrap: nowrap; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
    .p-onglets::-webkit-scrollbar { display: none; }
    .p-onglets .onglet { background: transparent; border-radius: 12px; min-height: 38px; padding: 8px 14px; white-space: nowrap; flex: 0 0 auto; }
    .p-onglets .onglet.actif { background: var(--marine); color: #fff; box-shadow: 0 4px 12px rgba(16,35,92,.3); }
    /* Fiches, contrats, paiements */

    .p-paiement { border-left: 0; background: #fff; border-radius: 10px; padding: 7px 10px; }

    /* Frais des coachs */

    .fr-periode input, .fr-ligne input.km { border-radius: 12px; }
    /* Mes équipes */
    .composer { border-radius: 16px; border-color: #9fb6ef; background: #fff; box-shadow: 0 4px 14px rgba(16,35,92,.06); font-family: Sora, Inter, sans-serif; }
    .taches-equipes .mini { background: #fff; box-shadow: 0 3px 10px rgba(16,35,92,.08); }
    .details-liste summary { font-weight: 600; }
    .ligne-joueur { padding: 8px 2px; }
    /* Fenêtres */
    .voile { background: rgba(10,22,56,.55); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
    .fenetre { box-shadow: 0 -10px 40px rgba(10,22,56,.3); }
    .fenetre h3 { margin: -2px -18px 14px; padding: 0 18px 12px; border-bottom: 1px solid #eef1f7; }
    .fenetre h3::before { content: ""; display: block; width: 40px; height: 4px; border-radius: 4px; background: #d6def2; margin: -6px auto 12px; }
    @media (min-width: 640px) { .fenetre h3::before { display: none; } }
    .champ { border-radius: 14px; border-color: #d6def2; }
    .champ:focus { outline: 0; border-color: #3d8bff; box-shadow: 0 0 0 3px rgba(124,196,255,.45); }
    .cv-bloc, .tm-ligne, .se-ligne { border-top-color: #eef1f7; }
    .bandeau-apercu { border-radius: 18px; }
    .vide { background: #fff; border-radius: 20px; box-shadow: 0 6px 18px rgba(16,35,92,.06); font-family: Sora, Inter, sans-serif; }
    /* Connexion */
    #ecranConnexion { flex-direction: column; background: radial-gradient(120% 90% at 80% -10%, #2b55c9 0%, var(--marine) 45%, var(--nuit) 100%); }
    .carte-connexion { border-radius: 26px; box-shadow: 0 24px 60px rgba(0,0,0,.35); }
    .carte-connexion h1 { font-family: Bungee, sans-serif; font-weight: 400; font-size: 1.5rem; color: var(--marine); }
    .neon-connexion { font-family: Bungee, sans-serif; color: #e9f5ff; font-size: 1.3rem; text-align: center; margin-bottom: 18px;
      text-shadow: 0 0 6px var(--neon), 0 0 18px #3d8bff, 0 0 32px #2b55c9; }
  </style>
</head>
<body>

  <!-- ===================== Connexion ===================== -->
  <div id="ecranConnexion" class="centre" hidden>
    <div class="neon-connexion" aria-hidden="true">Ici c'est Gouez</div>
    <main class="carte-connexion">
      <img class="logo-connexion" src="../images/logo-fcg.png" alt="Logo du FC Gouesnou">
      <h1>Espace club</h1>
      <p class="sous-titre">FC Gouesnou</p>

      <section id="choixConnexion">
        <button class="btn principal" id="btnGoogle">Se connecter avec Google</button>
        <p class="petit" style="margin-top:8px;">Pour les comptes fcgouesnou.com</p>
        <div class="separateur">ou</div>
        <form id="formEmail">
          <input class="champ" type="email" id="email" placeholder="Votre adresse e-mail" autocomplete="email" required>
          <button class="btn secondaire" id="btnCode" type="submit">Recevoir un code par e-mail</button>
        </form>
      </section>

      <section id="saisieCode" hidden>
        <p class="info" id="infoCode"></p>
        <form id="formCode">
          <input class="champ" type="text" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="Code" required>
          <button class="btn principal" id="btnValider" type="submit">Valider le code</button>
        </form>
        <button class="lien" id="btnRetour">Changer d'adresse ou renvoyer un code</button>
      </section>

      <p class="erreur" id="erreurConnexion" hidden></p>
      <p class="petit" style="margin-top:24px;">Version <span class="version-appli"></span> - pilote</p>
    </main>
  </div>

  <!-- ===================== Application ===================== -->
  <div id="ecranAppli" hidden>
    <header class="entete">
      <img class="logo-entete" src="../images/logo-fcg.png" alt="">
      <h2>Ici c'est Gouez<small>Espace club FC Gouesnou</small></h2>
      <button id="btnApercu" title="Voir l'application comme une autre personne" hidden>Voir en tant que</button>
      <button id="btnAide" title="Aide" aria-label="Aide">?</button>
      <button id="btnActualiser" title="Actualiser">Actualiser</button>
      <button id="btnSortir">Sortir</button>
    </header>
    <div class="contenu">
      <div id="bandeauApercu" class="bandeau-apercu" hidden></div>
      <p class="bonjour" id="bonjour"></p>
      <div id="carteSportEasy" class="carte-notif se" hidden></div>
      <div id="carteNotif" class="carte-notif" hidden></div>
      <div class="onglets" id="onglets" hidden>
        <button class="onglet actif" data-vue="avenir">À venir</button>
        <button class="onglet" data-vue="coach" hidden>Mes équipes</button>
        <button class="onglet" data-vue="partenaires" hidden>Partenaires</button>
        <button class="onglet" data-vue="attestations" hidden>Attestations</button>
        <button class="onglet" data-vue="frais" hidden>Frais des coachs</button>
        <button class="onglet" data-vue="admin" hidden>Administration</button>
      </div>
      <div id="vueAvenir"></div>
      <div id="vueCoach" hidden></div>
      <div id="vuePartenaires" hidden></div>
      <div id="vueAttestations" hidden></div>
      <div id="vueFrais" hidden></div>
      <div id="vueAdmin" hidden></div>
      <p class="petit" style="text-align:center; margin-top:28px;">Espace club FC Gouesnou - version <span class="version-appli"></span> - pilote</p>
    </div>
    <button class="flottant" id="btnNouvel" hidden>+ Nouvel événement</button>
  </div>

  <div id="fenetre" class="voile" hidden></div>
  <div id="toast" class="toast" hidden></div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    import { initPartenaires } from './partenaires.js?v=2.2';
    import { initAttestations } from './attestations.js?v=1.1';
    import { initAide } from './aide.js?v=1.4';
    import { initMatch } from './match.js?v=1.1';

    // ---------- Configuration ----------
    const SUPABASE_URL = 'https://ppzzqnkxeslkeijeradc.supabase.co';
    const SUPABASE_CLE = 'sb_publishable_uEaNogIeXycWb3cIL7rumg_8udo1u_0';
    const ADRESSE_APPLI = 'https://fcgouesnou.github.io/espace/';
    const PAGE_CONTACT = 'https://fcgouesnou.github.io/#contact';
    const FUSEAU = 'Europe/Paris';
    // Version de l'application : à changer ici ET dans espace/version.json à chaque publication
    const VERSION_APPLI = '0.32';

    const sbReel = createClient(SUPABASE_URL, SUPABASE_CLE, {
      auth: { flowType: 'pkce', detectSessionInUrl: true, persistSession: true }
    });

    // ---------- Aperçu « Voir en tant que » (lecture seule) ----------
    // Pendant un aperçu, toute écriture est refusée côté écran et les fonctions qui dépendent
    // de la personne connectée renvoient les valeurs calculées pour la personne observée.
    const AP = { actif: null, suisAdmin: false, peutApercu: false };
    const RPC_LECTURE = new Set(['covoiturage_evenements', 'covoit_candidats', 'convocations_evenement', 'composition_journee', 'communes_terrains', 'part_tableau_bord',
                                 'taches_evenement', 'fiche_match', 'taches_candidats', 'taches_equipe', 'convocation_motifs', 'match_direct', 'stats_equipe']);
    const MSG_APERCU = 'Aperçu en lecture seule : aucune modification n\'est enregistrée.';
    function refus() {
      const r = { data: null, error: { message: MSG_APERCU } };
      const f = new Proxy(function () {}, {
        get: (t, k) => k === 'then' ? (a, b) => Promise.resolve(r).then(a, b) : () => f,
        apply: () => f });
      return f;
    }
    const sb = new Proxy(sbReel, { get(t, k) {
      if (k === 'from') return (table) => {
        const q = t.from(table);
        if (!AP.actif) return q;
        return new Proxy(q, { get(q2, m) {
          if (['insert', 'update', 'upsert', 'delete'].includes(m)) return () => refus();
          const v = q2[m]; return typeof v === 'function' ? v.bind(q2) : v; } });
      };
      if (k === 'rpc') return (nom, args) => {
        if (AP.actif) {
          const ok = (data) => Promise.resolve({ data, error: null });
          if (nom === 'mes_roles') return ok(AP.actif.roles);
          if (nom === 'mes_equipes') return ok(AP.actif.mes_equipes);
          if (nom === 'equipes_coachees') return ok(AP.actif.equipes_coachees);
          if (!RPC_LECTURE.has(nom)) return refus();
        }
        return t.rpc(nom, args);
      };
      const v = t[k]; return typeof v === 'function' ? v.bind(t) : v;
    } });

    const $ = (id) => document.getElementById(id);
    const el = (tag, attrs = {}, ...enfants) => {
      const n = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs)) {
        if (k === 'class') n.className = v;
        else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
        else if (v !== undefined && v !== null && v !== false) n.setAttribute(k, v === true ? '' : v);
      }
      for (const e of enfants.flat()) if (e !== null && e !== undefined && e !== false) n.append(e instanceof Node ? e : document.createTextNode(e));
      return n;
    };

    // ---------- État ----------
    let session = null;
    let emailEnCours = '';
    const E = { fiches: [], personnes: new Map(), repondPour: new Set(), equipes: new Map(), coachees: new Set(), miennes: new Set(),
                evenements: [], convocations: [], resumes: new Map(), clubs: new Map(), covoit: new Map(), taches: new Map() };

    // ---------- Outils ----------
    function toast(t) { const n = $('toast'); n.textContent = t; n.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => n.hidden = true, 3200); }
    const fmtJour = new Intl.DateTimeFormat('fr-FR', { timeZone: FUSEAU, weekday: 'long', day: 'numeric', month: 'long' });
    const fmtHeure = new Intl.DateTimeFormat('fr-FR', { timeZone: FUSEAU, hour: '2-digit', minute: '2-digit' });
    const jourDe = (d) => { const s = fmtJour.format(new Date(d)); return s.charAt(0).toUpperCase() + s.slice(1); };
    const heure = (d) => fmtHeure.format(new Date(d)).replace(':', 'h');
    const LIB_TYPE = { match: 'Match', entrainement: 'Entraînement', tournoi: 'Tournoi', reunion: 'Réunion', autre: 'Événement' };
    const age = (p) => p.annee_naissance ? new Date().getFullYear() - p.annee_naissance : null;
    const fmtCle = new Intl.DateTimeFormat('en-CA', { timeZone: FUSEAU, year: 'numeric', month: '2-digit', day: '2-digit' });
    const cleJour = (d) => fmtCle.format(new Date(d));
    const sansHeure = (evt) => heure(evt.debut) === '00h00' && !evt.fin;
    const avecGroupes = (equipeId) => { const q = E.equipes.get(equipeId); return q && q.sous_groupes && q.sous_groupes.length ? q.sous_groupes : null; };
    const estMatch = (evt) => evt.type === 'match' || evt.type === 'tournoi';
    // Événement encore à afficher : commencé il y a moins de 3 h, ou sans heure et prévu aujourd'hui
    const aVenir = (e) => new Date(e.debut).getTime() > Date.now() - 3 * 3600 * 1000 || (sansHeure(e) && cleJour(e.debut) === cleJour(new Date()));
    const fmtJourCourt = new Intl.DateTimeFormat('fr-FR', { timeZone: FUSEAU, day: 'numeric', month: 'long' });
    const jourCourt = (d) => fmtJourCourt.format(new Date(d));

    function messageErreur(error) {
      const m = (error && error.message || '').toLowerCase();
      if (m.includes('pas connue du club') || m.includes('signups not allowed') || m.includes('user not found'))
        return 'inconnue';
      if (m.includes('expired') || m.includes('invalid')) return 'Code incorrect ou expiré. Vérifiez le dernier e-mail reçu, ou demandez un nouveau code.';
      if (m.includes('rate limit') || m.includes('security purposes')) return 'Trop de demandes rapprochées. Patientez une minute avant de redemander un code.';
      return 'Erreur : ' + (error && error.message || 'inconnue');
    }
    function erreurConnexion(texte) {
      const n = $('erreurConnexion'); n.replaceChildren();
      if (!texte) { n.hidden = true; return; }
      if (texte === 'inconnue') {
        n.append("Cette adresse n'est pas connue du club. Utilisez l'adresse donnée lors de l'inscription, ou contactez-nous par la rubrique ",
                 el('a', { href: PAGE_CONTACT, target: '_blank', rel: 'noopener' }, '« Nous contacter »'), ' du site du FC Gouesnou.');
      } else n.append(texte);
      n.hidden = false;
    }

    // ---------- Connexion ----------
    const params = new URLSearchParams(location.search + '&' + location.hash.replace(/^#/, ''));
    if (params.get('error_description')) erreurConnexion(messageErreur({ message: params.get('error_description') }));
    // Lien d'une notification « Fiche du match » : lu avant que l'adresse ne soit nettoyée à la connexion
    let ficheDemandee = params.get('fiche');

    $('btnGoogle').addEventListener('click', async () => {
      erreurConnexion('');
      const { error } = await sb.auth.signInWithOAuth({ provider: 'google',
        options: { redirectTo: ADRESSE_APPLI, queryParams: { hd: 'fcgouesnou.com', prompt: 'select_account' } } });
      if (error) erreurConnexion(messageErreur(error));
    });
    $('formEmail').addEventListener('submit', async (e) => {
      e.preventDefault(); erreurConnexion('');
      const email = $('email').value.trim().toLowerCase();
      $('btnCode').disabled = true;
      const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: true } });
      $('btnCode').disabled = false;
      if (error) { erreurConnexion(messageErreur(error)); return; }
      emailEnCours = email;
      $('infoCode').textContent = 'Un code a été envoyé à ' + email + '. Pensez à regarder dans les courriers indésirables.';
      $('code').value = ''; $('choixConnexion').hidden = true; $('saisieCode').hidden = false; $('code').focus();
    });
    $('formCode').addEventListener('submit', async (e) => {
      e.preventDefault(); erreurConnexion('');
      $('btnValider').disabled = true;
      const { error } = await sb.auth.verifyOtp({ email: emailEnCours, token: $('code').value.replace(/\D/g, ''), type: 'email' });
      $('btnValider').disabled = false;
      if (error) erreurConnexion(messageErreur(error)); else emailEnCours = '';
    });
    $('btnRetour').addEventListener('click', () => { emailEnCours = ''; erreurConnexion(''); $('saisieCode').hidden = true; $('choixConnexion').hidden = false; });
    $('btnSortir').addEventListener('click', async () => {
      try { const sub = await abonnementActuel(); if (sub) await sbReel.from('appareils').delete().eq('endpoint', sub.endpoint); } catch (e) {}

    // ---------- Actualiser et nouvelles versions ----------
    // « Actualiser » : si une version plus récente est publiée (version.json), la charge (adresse avec ?v=
    // pour ne pas reprendre la page gardée en cache) ; sinon recharge les données et l'onglet affiché.
    document.querySelectorAll('.version-appli').forEach(x => { x.textContent = VERSION_APPLI; });
    async function versionPubliee() {
      try { const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' }); return r.ok ? ((await r.json()).version || null) : null; }
      catch (e) { return null; }
    }
    async function verifierVersion() {
      const v = await versionPubliee();
      const nouvelle = v && v !== VERSION_APPLI ? v : null;
      const b = $('btnActualiser');
      b.classList.toggle('nouvelle-version', !!nouvelle);
      b.textContent = nouvelle ? 'Mettre à jour' : 'Actualiser';
      b.title = nouvelle ? 'Nouvelle version ' + nouvelle + ' disponible : toucher pour l\'installer' : 'Recharger les données';
      return nouvelle;
    }
    function actualiserVue() {
      if (vue === 'partenaires' && P) P.afficher($('vuePartenaires'));
      else if (vue === 'attestations' && A) A.afficher($('vueAttestations'));
      else if (vue === 'frais') afficherFrais();
      else if (vue === 'admin') afficherAdmin();
    }
    let actualisationEnCours = false;
    async function actualiser() {
      if (actualisationEnCours || !session) return;
      actualisationEnCours = true; $('btnActualiser').disabled = true;
      try {
        const v = await verifierVersion();
        if (v) { toast('Installation de la version ' + v + '...'); location.replace(ADRESSE_APPLI + '?v=' + encodeURIComponent(v)); return; }
        await charger(); majCarteSportEasy(); actualiserVue();
        toast('Données à jour - version ' + VERSION_APPLI + ', la plus récente.');
      } finally { actualisationEnCours = false; $('btnActualiser').disabled = false; }
    }
    $('btnActualiser').addEventListener('click', actualiser);

    // Glisser l'écran vers le bas depuis le haut de la page : même effet que « Actualiser »
    const TIRER_SEUIL = 80;
    const tirer = { y0: null, x0: 0, dy: 0 };
    const indicTirer = el('div', { class: 'tirer' }, 'Tirer pour actualiser');
    document.body.append(indicTirer);
    const finTirer = () => { indicTirer.classList.remove('visible', 'pret'); indicTirer.style.transform = ''; };
    window.addEventListener('touchstart', (e) => {
      tirer.y0 = null;
      if (window.scrollY > 0 || !$('fenetre').hidden || $('ecranAppli').hidden || e.touches.length !== 1) return;
      tirer.y0 = e.touches[0].clientY; tirer.x0 = e.touches[0].clientX; tirer.dy = 0;
    }, { passive: true });
    window.addEventListener('touchmove', (e) => {
      if (tirer.y0 === null) return;
      const dy = e.touches[0].clientY - tirer.y0, dx = Math.abs(e.touches[0].clientX - tirer.x0);
      if (dy <= 0 || dx > dy) { tirer.dy = 0; finTirer(); return; }
      tirer.dy = dy;
      const pret = dy > TIRER_SEUIL;
      indicTirer.classList.add('visible'); indicTirer.classList.toggle('pret', pret);
      indicTirer.textContent = pret ? 'Relâcher pour actualiser' : 'Tirer pour actualiser';
      indicTirer.style.transform = 'translate(-50%, ' + Math.round(Math.min(dy, 140) / 2) + 'px)';
    }, { passive: true });
    window.addEventListener('touchend', () => {
      if (tirer.y0 === null) return;
      const go = tirer.dy > TIRER_SEUIL; tirer.y0 = null; tirer.dy = 0; finTirer();
      if (go) actualiser();
    });
    // Retour sur l'application (téléphone sorti de veille, onglet repris) : signale une nouvelle version
    document.addEventListener('visibilitychange', () => { if (!document.hidden && session) verifierVersion(); });

    // Motifs d'absence (fonction convocation_motifs) : texte pour le joueur, sa famille et les coachs ;
    // pour les autres (présidents en aperçu), seulement l'indication qu'un motif existe
    function ajouterMotifs(lignes, motifs) {
      const m = new Map((motifs || []).map(x => [x.evenement_id + '|' + x.personne_id, x]));
      return lignes.map(l => { const x = m.get(l.evenement_id + '|' + l.personne_id); return { ...l, motif: x ? x.motif : null, a_motif: !!(x && x.a_motif) }; });
    }

    // ---------- Chargement des données ----------
    async function charger() {
      const uid = session.user.id;
      let fiches = null;
      if (AP.actif) fiches = AP.actif.fiches;
      else {
        const { data, error: e1 } = await sb.from('personnes').select('id, prenom, nom, annee_naissance, club_id').eq('user_id', uid);
        if (e1) { toast('Erreur de chargement : ' + e1.message); return; }
        fiches = data;
      }
      E.fiches = fiches || [];
      E.personnes = new Map(E.fiches.map(p => [p.id, { ...p, moi: true }]));
      // Âge à partir duquel un joueur répond lui-même (réglage du club, 16 ans au FC Gouesnou) ; les parents gardent la main
      const clubIds = [...new Set(E.fiches.map(p => p.club_id))];
      if (clubIds.length) {
        const { data: cl } = await sb.from('clubs').select('id, age_majorite').in('id', clubIds);
        for (const c of cl || []) E.clubs.set(c.id, c);
      }
      const ageReponse = (p) => (E.clubs.get(p.club_id) || {}).age_majorite || 18;
      E.repondPour = new Set(E.fiches.filter(p => age(p) === null || age(p) >= ageReponse(p)).map(p => p.id));

      if (AP.actif) {
        for (const x of AP.actif.enfants) { E.personnes.set(x.id, { ...x, enfant: true }); E.repondPour.add(x.id); }
      } else if (E.fiches.length) {
        const ids = E.fiches.map(p => p.id);
        const { data: enfants } = await sb.from('liens_famille')
          .select('enfant_id, enfant:personnes!liens_famille_enfant_id_fkey(id, prenom, nom, annee_naissance, club_id)')
          .in('parent_id', ids);
        for (const l of enfants || []) if (l.enfant) { E.personnes.set(l.enfant.id, { ...l.enfant, enfant: true }); E.repondPour.add(l.enfant.id); }
      }

      const [{ data: mesEq }, { data: coachEq }] = await Promise.all([sb.rpc('mes_equipes'), sb.rpc('equipes_coachees')]);
      E.coachees = new Set(coachEq || []);
      E.miennes = new Set(mesEq || []);
      const idsEq = [...new Set([...(mesEq || []), ...(coachEq || [])])];
      E.equipes = new Map();
      if (idsEq.length) {
        const { data: eqs } = await sb.from('equipes').select('id, nom, categorie, club_id, sous_groupes').in('id', idsEq);
        for (const q of eqs || []) E.equipes.set(q.id, q);
      }

      E.evenements = []; E.convocations = []; E.resumes = new Map(); E.covoit = new Map(); E.taches = new Map();
      if (idsEq.length) {
        // Depuis minuit (heure de Paris) : un match sans heure du jour reste chargé ; filtré ensuite par aVenir()
        const depuis = new Date(Math.min(Date.now() - 3 * 3600 * 1000, Date.now() - (Date.now() - new Date(cleJour(new Date()) + 'T00:00:00').getTime()) - 2 * 3600 * 1000)).toISOString();
        const jusqua = new Date(Date.now() + 28 * 86400 * 1000).toISOString();
        const { data: evts } = await sb.from('evenements').select('*, terrain:terrains(lat, lon)').in('equipe_id', idsEq).gte('debut', depuis).lte('debut', jusqua).order('debut').limit(150);
        // Les sondages SportEasy annulés (« Présence des joueurs ») ne sont pas affichés
        E.evenements = (evts || []).filter(e => !(e.etat === 'annule' && e.type === 'autre' && e.source_uid));
        const idsEvt = E.evenements.map(e => e.id);
        const idsPers = [...E.personnes.keys()];
        if (idsEvt.length && idsPers.length) {
          const [{ data: cv }, { data: mt }] = await Promise.all([
            sb.from('convocations').select('evenement_id, personne_id, reponse').in('evenement_id', idsEvt).in('personne_id', idsPers),
            sb.rpc('convocation_motifs', { evs: idsEvt })]);
          E.convocations = ajouterMotifs(cv || [], mt);
        }
        await Promise.all(idsEvt.map(async (id) => {
          const { data } = await sb.rpc('convocations_evenement', { ev: id });
          let lignes = data || [];
          // En aperçu, la personne observée ne voit les réponses que si elle coache l'équipe, est au CODIR
          // ou si le club laisse les familles voir les réponses
          if (AP.actif) {
            const evt = E.evenements.find(x => x.id === id);
            const voit = AP.actif.familles_voient_reponses || E.coachees.has(evt && evt.equipe_id) || AP.actif.roles.some(r => r.role === 'codir');
            if (!voit) lignes = lignes.map(l => ({ ...l, reponse: null }));
          }
          E.resumes.set(id, lignes);
        }));
        await Promise.all([chargerCovoit(), chargerTaches()]);
      }
      afficher();
    }

    // ---------- Affichage ----------
    let vue = 'avenir';
    let P = null, partenairesOk = false, A = null, attestationsOk = false;
    async function preparerPartenaires() {
      if (!P) P = initPartenaires({ sb, el, toast });

    function afficher() {

    for (const b of document.querySelectorAll('#onglets .onglet')) b.addEventListener('click', () => {
      vue = b.dataset.vue;
      document.querySelectorAll('#onglets .onglet').forEach(x => x.classList.toggle('actif', x === b));

    function pastilles(evt) {
      const t = evt.type === 'match' || evt.type === 'tournoi' ? 'p-match' : evt.type === 'entrainement' ? 'p-entrainement' : 'p-autre';
      const r = [el('span', { class: 'pastille ' + t }, LIB_TYPE[evt.type] || 'Événement')];
      if (estMatch(evt) && avecGroupes(evt.equipe_id))
        r.push(evt.groupe ? el('span', { class: 'pastille p-groupe' }, 'Équipe ' + evt.groupe) : el('span', { class: 'pastille p-sansgroupe' }, 'Équipe à choisir'));
      if (estMatch(evt) && sansHeure(evt) && evt.etat !== 'annule') r.push(el('span', { class: 'pastille p-horaire' }, '⏱ Horaire à confirmer'));
      if (evt.etat === 'annule') r.push(el('span', { class: 'pastille p-annule' }, 'Annulé'));
      else if (evt.changement && evt.changement_le && Date.now() - new Date(evt.changement_le) < 3 * 86400000) {
        // Repère temporaire (3 jours) : ce qui a changé ; la notification est partie au moment du changement
        const c = evt.changement.split(', ');
        const lib = c.length > 1 ? c.join(' et ').replace(/^h/, 'H').replace(/^r/, 'R').replace(/^l/, 'L') + ' modifiés'
          : { heure: 'Heure modifiée', 'rendez-vous': 'Rendez-vous modifié', lieu: 'Lieu modifié' }[c[0]] || 'Modifié';
        r.push(el('span', { class: 'pastille p-modifie', title: 'Changement du ' + jourDe(evt.changement_le) }, lib));
      }
      return r;
    }
    function titre(evt) {
      const eq = E.equipes.get(evt.equipe_id);
      if (evt.type === 'match' || evt.type === 'tournoi')
        return (eq ? eq.nom : '') + (evt.adversaire ? (evt.domicile === false ? ' chez ' : ' contre ') + evt.adversaire : '') + (evt.titre ? ' - ' + evt.titre : '');
      return (evt.titre || LIB_TYPE[evt.type]) + (eq ? ' - ' + eq.nom : '');
    }
    function details(evt) {
      const l = [];
      let h = sansHeure(evt) ? 'Horaire à confirmer' : heure(evt.debut) + (evt.fin ? ' à ' + heure(evt.fin) : '');
      l.push(evt.rendez_vous && sansHeure(evt) ? 'Horaire du match à confirmer' : h);
      if (evt.lieu || evt.adresse) l.push([evt.lieu, evt.adresse].filter(Boolean).join(', '));
      const dest = evt.terrain && evt.terrain.lat ? evt.terrain.lat + ',' + evt.terrain.lon : [evt.lieu, evt.adresse].filter(Boolean).join(', ');
      if (dest && evt.etat !== 'annule')
        l.push(el('a', { class: 'itineraire', target: '_blank', rel: 'noopener',
          href: 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(dest) }, 'Itinéraire'));
      return l;
    }
    // Rendez-vous mis en évidence (heure fixée par le coach)
    function blocRdv(evt) {
      if (!evt.rendez_vous || evt.etat === 'annule') return null;
      const memeJour = cleJour(evt.rendez_vous) === cleJour(evt.debut);
      return el('div', { class: 'rdv' }, el('span', { class: 'rdv-ico' }, '⏰'),
        el('span', {}, 'Rendez-vous ', el('strong', {}, heure(evt.rendez_vous)), memeJour ? '' : ' (' + jourDe(evt.rendez_vous) + ')',
          !sansHeure(evt) && estMatch(evt) ? el('small', {}, ' · coup d\'envoi ' + heure(evt.debut)) : null));
    }
    function compteur(evt) {
      const r = E.resumes.get(evt.id) || [];
      if (!r.length) return null;
      const n = { present: 0, absent: 0, incertain: 0, sans_reponse: 0 };
      for (const x of r) if (x.reponse) n[x.reponse]++;
      return el('div', { class: 'compteur' },
        el('span', { class: 'c-present' }, n.present + ' présent' + (n.present > 1 ? 's' : '')),
        el('span', { class: 'c-absent' }, n.absent + ' absent' + (n.absent > 1 ? 's' : '')),
        n.incertain ? el('span', { class: 'c-incertain' }, n.incertain + ' incertain' + (n.incertain > 1 ? 's' : '')) : null,
        el('span', { class: 'c-sans' }, n.sans_reponse + ' sans réponse'));
    }
    function listeConvoques(evt) {
      const r = E.resumes.get(evt.id) || [];
      if (!r.length) return null;
      const lib = { present: 'Présent', absent: 'Absent', incertain: 'Incertain', sans_reponse: 'Sans réponse' };
      return el('details', { class: 'details-liste' }, el('summary', {}, 'Voir les convoqués (' + r.length + ')'),
        r.map(x => el('div', { class: 'ligne-joueur' }, el('span', {}, x.prenom + ' ' + x.initiale + '.'), el('span', {}, lib[x.reponse] || '-'))));
    }

    function blocReponse(evt, cv) {
      const p = E.personnes.get(cv.personne_id);
      const peut = E.repondPour.has(cv.personne_id) && evt.etat !== 'annule';
      const nom = p ? (p.moi ? 'Moi' : p.prenom) : '';
      const tard = evt.date_limite && new Date(evt.date_limite) < new Date();
      const bloc = el('div', { class: 'personne' },
        el('div', { class: 'personne-nom' }, el('span', {}, nom),
          tard && cv.reponse === 'sans_reponse' ? el('span', { class: 'petit', style: 'color:var(--rouge)' }, 'Date limite dépassée') : null));
      const zone = el('div', { class: 'reponses' });
      for (const [val, lib] of [['present', 'Présent'], ['absent', 'Absent'], ['incertain', 'Incertain']]) {
        zone.append(el('button', { class: 'rep ' + val + (cv.reponse === val ? ' choisi' : ''), disabled: !peut,
          onclick: () => repondre(evt, cv, val, bloc) }, lib));
      }
      bloc.append(zone);
      if (!peut && evt.etat !== 'annule') bloc.append(el('div', { class: 'note' }, 'La réponse est donnée par un parent.'));
      if ((cv.motif || cv.a_motif) && (cv.reponse === 'absent' || cv.reponse === 'incertain'))
        bloc.append(el('div', { class: 'note' }, cv.motif ? 'Motif : ' + cv.motif : 'Motif renseigné (visible des coachs).'));
      return bloc;
    }

    async function repondre(evt, cv, val, bloc) {
      if (cv.reponse === val) return;
      const desistement = cv.reponse === 'present' && val !== 'present';
      const avant = cv.reponse;
      cv.reponse = val;
      const { error } = await sb.from('convocations').update({ reponse: val }).eq('evenement_id', evt.id).eq('personne_id', cv.personne_id);
      if (error) { cv.reponse = avant; toast('Réponse non enregistrée : ' + error.message); afficher(); return; }
      const r = (E.resumes.get(evt.id) || []);
      const { data } = await sb.rpc('convocations_evenement', { ev: evt.id }); E.resumes.set(evt.id, data || r);
      afficher();
      toast(desistement ? 'Désistement enregistré. Le coach le verra dans sa liste.' : 'Réponse enregistrée.');
      if (val !== 'present') demanderMotif(evt, cv);
    }

    function demanderMotif(evt, cv) {
      ouvrirFenetre('Motif (facultatif)', (f) => {
        const champ = el('input', { class: 'champ', placeholder: 'Ex. malade, vacances, examen', maxlength: 120, value: cv.motif || '' });
        f.append(el('p', { class: 'petit' }, 'Seul le coach voit le motif.'), champ,
          el('div', { class: 'boutons' },
            el('button', { class: 'btn secondaire', onclick: fermerFenetre }, 'Passer'),
            el('button', { class: 'btn principal', onclick: async () => {
              const motif = champ.value.trim() || null;
              const { error } = await sb.from('convocations').update({ motif }).eq('evenement_id', evt.id).eq('personne_id', cv.personne_id);
              if (error) { toast('Motif non enregistré : ' + error.message); return; }
              cv.motif = motif; fermerFenetre(); afficher(); toast('Motif enregistré.');
            } }, 'Enregistrer')));
        setTimeout(() => champ.focus(), 50);
      });
    }

    // ---------- Covoiturage (matchs et tournois) ----------
    const covoitPossible = (evt) => estMatch(evt) && evt.etat !== 'annule' && new Date(evt.debut) > new Date();
    async function chargerCovoit(ids) {
      const evs = ids || E.evenements.filter(covoitPossible).map(e => e.id);
      if (!evs.length) return;
      const { data, error } = await sb.rpc('covoiturage_evenements', { evs });
      if (error) return;
      for (const id of evs) E.covoit.set(id, []);
      for (const r of data || []) E.covoit.get(r.evenement_id).push(r);
    }
    const estMien = (pid) => E.personnes.has(pid);
    // Personnes de ma famille convoquées à l'événement, pour qui je peux réserver
    const mesConvoques = (evt) => E.convocations.filter(c => c.evenement_id === evt.id && E.repondPour.has(c.personne_id) && c.reponse !== 'absent')
      .map(c => E.personnes.get(c.personne_id)).filter(Boolean);
    // Adulte de la famille qui peut proposer sa voiture
    const conducteurs = () => E.fiches.filter(p => age(p) === null || age(p) >= 18);
    const placeDe = (evt, pid) => (E.covoit.get(evt.id) || []).find(o => o.sens === 'propose' && o.passagers.some(x => x.personne_id === pid));
    const telLien = (t) => t ? el('a', { href: 'tel:' + t.replace(/\s/g, '') }, t) : null;

    function blocCovoit(evt) {
      if (!covoitPossible(evt)) return null;
      const liste = E.covoit.get(evt.id) || [];
      const offres = liste.filter(o => o.sens === 'propose'), demandes = liste.filter(o => o.sens === 'cherche');
      const libres = offres.reduce((n, o) => n + Math.max(0, o.places - o.passagers.length), 0);
      const mes = mesConvoques(evt).map(p => { const o = placeDe(evt, p.id); return o ? p.prenom + ' monte avec ' + o.auteur : null; }).filter(Boolean);
      const mienne = offres.find(o => estMien(o.auteur_id));
      const aRepondre = mienne && mienne.designation === 'en_attente';
      const texte = el('div', { class: 'texte' },
        el('strong', {}, 'Covoiturage : '),
        offres.length ? libres + ' place' + (libres > 1 ? 's' : '') + ' libre' + (libres > 1 ? 's' : '') + ' dans ' + offres.length + ' voiture' + (offres.length > 1 ? 's' : '') : 'aucune voiture proposée',
        demandes.length ? ' · ' + demandes.length + ' demande' + (demandes.length > 1 ? 's' : '') : '',
        aRepondre ? el('div', { style: 'color:var(--orange);font-weight:600' }, 'Le coach vous désigne conducteur : réponse attendue')
          : mienne ? ' · vous conduisez (' + mienne.passagers.length + '/' + mienne.places + ')' : '',
        mes.length ? el('div', {}, mes.join(' ; ')) : null);
      return el('div', { class: 'covoit' }, texte, el('button', { class: 'mini', onclick: () => ouvrirCovoit(evt) }, 'Covoiturage'));
    }

    async function actionCovoit(evt, promesse, message) {
      const { error } = await promesse;
      if (error) { toast('Erreur : ' + (error.message || error)); return false; }
      await chargerCovoit([evt.id]);
      toast(message); afficher(); ouvrirCovoit(evt);
      return true;
    }

    function ouvrirCovoit(evt) {

    // ---------- Tâches du match et fiche du match ----------
    // Tâches proposées sur chaque match ou tournoi à venir (modèles du club, adaptés par équipe) ;
    // les coachs et dirigeants voient tout, les parents seulement les tâches qui leur sont ouvertes.
    async function chargerTaches(ids) {
      const evs = ids || E.evenements.filter(covoitPossible).map(e => e.id);
      await Promise.all(evs.map(async (id) => {
        const { data, error } = await sb.rpc('taches_evenement', { ev: id });
        if (!error) E.taches.set(id, data || []);
      }));
    }
    function blocTaches(evt) {
      if (!covoitPossible(evt)) return null;
      const t = E.taches.get(evt.id) || [];
      const coach = E.coachees.has(evt.equipe_id);
      if (!t.length && !coach) return null;
      const prises = t.filter(x => x.personne_id).length;
      const miennes = t.filter(x => x.mien).map(x => x.libelle);
      const texte = el('div', { class: 'texte' }, el('strong', {}, 'Tâches : '),
        t.length ? prises + ' prise' + (prises > 1 ? 's' : '') + ' sur ' + t.length : 'aucune tâche pour ce match',
        miennes.length ? el('div', {}, 'Vous : ' + miennes.join(', ')) : null);
      return el('div', { class: 'covoit' }, texte,
        t.length ? el('button', { class: 'mini', onclick: () => ouvrirTaches(evt) }, 'Tâches') : null,
        coach ? el('button', { class: 'mini', onclick: () => ouvrirFiche(evt.id) }, 'Fiche du match') : null);
    }
    // Direct du match : bouton sur la carte des matchs (coachs à tout moment, les autres dès 30 min avant)
    function blocDirect(evt) {
      if (!estMatch(evt) || evt.etat === 'annule') return null;
      const coach = E.coachees.has(evt.equipe_id);
      const debut = new Date(evt.debut).getTime();
      if (!coach && Date.now() < debut - 30 * 60000) return null;
      const enCours = Date.now() >= debut && Date.now() < debut + 2.5 * 3600000;
      return el('div', { class: 'covoit direct-carte' },
        el('div', { class: 'texte' }, el('strong', {}, enCours ? 'Match en cours' : Date.now() < debut ? 'Direct du match' : 'Résumé du match'),
          el('div', {}, enCours ? 'Score, buteurs, remplacements en direct' : 'Buts, passes, remplacements, cartons')),
        el('button', { class: 'mini' + (enCours ? ' principal' : ''), onclick: () => MT.ouvrirDirect(evt.id) }, enCours ? 'Suivre le direct' : 'Ouvrir'));
    }
    async function actionTache(evt, promesse, message) {
      const { error } = await promesse;
      if (error) { toast('Erreur : ' + (error.message || error)); return; }
      await chargerTaches([evt.id]);
      toast(message); afficher(); ouvrirTaches(evt);

      ouvrirFenetre('Tâches - ' + titre(evt), (f) => {

          const a = el('div', { class: 'cv-actions' });

          if (x.personne_id && (x.mien || coach))

            (v.depart || v.heure) ? el('span', { class: 'gris' }, ' - départ' + (v.depart ? ' ' + v.depart : '') + (v.heure ? ' à ' + heure(v.heure) : '')) : null,

        // Sans place : joueurs présents ou incertains qui n'ont pas de voiture (match à l'extérieur)
        const sansPlace = fi.sans_place.filter(n => fi.presents.includes(n) || fi.incertains.includes(n));
        if (fi.domicile === false && sansPlace.length) f.append(el('div', { class: 'fm-ligne' }, el('strong', {}, 'Sans place : '), noms(sansPlace)));
        if (fi.demandes.length) f.append(el('div', { class: 'fm-ligne' }, el('strong', {}, 'Cherchent une place : '), noms(fi.demandes)));
        const t = taches || [];
        const nbPrises = t.filter(x => x.personne_id).length;
        f.append(el('div', { class: 'fm-section' }, 'Tâches : ' + nbPrises + ' prise' + (nbPrises > 1 ? 's' : '') + ' sur ' + t.length));
        for (const x of t) f.append(el('div', { class: 'fm-ligne' }, x.libelle + ' : ',
          x.personne_id ? el('strong', {}, x.responsable) : el('span', { style: 'color:var(--orange);font-weight:600' }, 'à prendre'),
          x.rotation && x.chez ? el('span', { class: 'gris' }, ' (maillots chez ' + x.chez + ')') : null));
        f.append(el('div', { class: 'boutons', style: 'flex-wrap:wrap' },
          evt ? el('button', { class: 'btn secondaire', onclick: () => ouvrirTaches(evt) }, 'Tâches') : null,
          evt ? el('button', { class: 'btn secondaire', onclick: () => ouvrirCovoit(evt) }, 'Covoiturage') : null,
          el('button', { class: 'btn secondaire', onclick: fermerFenetre }, 'Fermer')));
      });
    }

    // Tâches de match d'une équipe (coachs) : tâches du club à garder ou retirer, tâches propres à l'équipe
    async function gererTaches(equipeId) {
      const { data, error } = await sb.rpc('taches_equipe', { p_equipe: equipeId });
      if (error) { toast('Erreur : ' + error.message); return; }
      const q = E.equipes.get(equipeId);
      const LIB_QUAND = { toujours: 'tous les matchs', exterieur: 'matchs à l\'extérieur', domicile: 'matchs à domicile' };
      const apres = async (message) => { toast(message); await chargerTaches(); afficher(); gererTaches(equipeId); };
      ouvrirFenetre('Tâches de match - ' + (q ? q.nom : ''), (f) => {
        f.append(el('p', { class: 'petit' }, 'Ces tâches apparaissent sur chaque match de l\'équipe. Décochez une tâche du club pour la retirer de vos matchs ; ajoutez les vôtres en bas.'));

          const detail = el('small', {}, LIB_QUAND[m.quand] + (m.ouvert_parents ? ' · ouverte aux parents' : '') +
            (m.joueurs_age_min ? ' · confiée aux joueurs de ' + m.joueurs_age_min + ' ans et plus' : '') + (m.du_club ? '' : ' · propre à l\'équipe'));
          if (m.du_club) {
            const cb = el('input', { type: 'checkbox', checked: m.active });
            cb.addEventListener('change', async () => {
              const { error: e2 } = await sb.rpc('tache_modele_activer', { p_equipe: equipeId, p_modele: m.id, p_active: cb.checked });
              if (e2) { cb.checked = !cb.checked; toast('Erreur : ' + e2.message); return; }
              apres(cb.checked ? 'Tâche remise sur les matchs.' : 'Tâche retirée des matchs de l\'équipe.');
            });
            f.append(el('label', { class: 'tm-ligne' }, cb, el('span', {}, m.libelle, detail)));
          } else {
            f.append(el('div', { class: 'tm-ligne' }, el('span', { style: 'flex:1' }, m.libelle, detail),
              el('button', { class: 'mini danger', onclick: async () => {
                if (!confirm('Supprimer la tâche « ' + m.libelle + ' » ?')) return;
                const { error: e2 } = await sb.rpc('tache_modele_activer', { p_equipe: equipeId, p_modele: m.id, p_active: false });
                if (e2) { toast('Erreur : ' + e2.message); return; }
                apres('Tâche supprimée.');
              } }, 'Supprimer')));
          }
        }
        const lib = el('input', { class: 'champ', placeholder: 'Nouvelle tâche (ex. Goûter, Feuille de match)', maxlength: 60 });
        const quand = el('select', { class: 'champ' }, Object.entries(LIB_QUAND).map(([k, v]) => el('option', { value: k }, 'Pour ' + (k === 'toujours' ? v : 'les ' + v))));
        const parents = el('input', { type: 'checkbox' });
        f.append(el('div', { class: 'fm-section' }, 'Ajouter une tâche'), lib, quand,
          el('label', { class: 'tm-ligne', style: 'border:0' }, parents, el('span', {}, 'Ouverte aux parents', el('small', {}, 'Sinon réservée aux coachs et dirigeants'))),
          el('div', { class: 'boutons' },
            el('button', { class: 'btn secondaire', onclick: fermerFenetre }, 'Fermer'),
            el('button', { class: 'btn principal', onclick: async () => {
              if (!lib.value.trim()) { toast('Indiquez le nom de la tâche.'); lib.focus(); return; }
              const { error: e2 } = await sb.rpc('tache_modele_ajouter', { p_equipe: equipeId, p_libelle: lib.value.trim(), p_quand: quand.value, p_parents: parents.checked });
              if (e2) { toast('Erreur : ' + e2.message); return; }

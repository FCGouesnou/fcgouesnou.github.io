    }

    // ---------- Mises à jour SportEasy (administrateurs) ----------
    // La comparaison nocturne (Apps Script puis fonction « comparer-sporteasy ») n'applique rien :
    // chaque écart est une proposition à appliquer ou à ignorer ici. Une proposition ignorée ne revient pas.
    const SE_GROUPES = [
      ['nouveau_membre', 'Nouveaux membres d\'équipe'], ['depart', 'Départs'], ['role', 'Rôles'],
      ['coordonnees', 'Coordonnées'], ['annee', 'Années de naissance'],
      ['parent_ajout', 'Parents à rattacher'], ['parent_maj', 'Parents à mettre à jour'], ['lien_retire', 'Parents à détacher'],
    ];
    async function lirePropositionsSE() {
      const { data, error } = await sbReel.from('maj_sporteasy').select('id, type, libelle, detail, fichier, cree_le')
        .eq('statut', 'à valider').order('type').order('libelle');
      if (error) throw error;
      return data || [];
    }
    async function majCarteSportEasy() {
      const c = $('carteSportEasy');
      if (!AP.suisAdmin || AP.actif) { c.hidden = true; return; }
      let props = [];
      try { props = await lirePropositionsSE(); } catch (e) { c.hidden = true; return; }
      c.replaceChildren();
      if (!props.length) { c.hidden = true; return; }
      c.append(el('div', { class: 'texte' }, 'Mises à jour SportEasy : ' + props.length + ' proposition' + (props.length > 1 ? 's' : '') + ' à valider',
          el('small', {}, 'Extraction « ' + (props[0].fichier || 'SportEasy') + ' ». Rien n\'est modifié sans votre accord.')),
        el('button', { class: 'mini principal', onclick: ouvrirSportEasy }, 'Voir'));
      c.hidden = false;
    }
    async function ouvrirSportEasy() {
      let props;
      try { props = await lirePropositionsSE(); } catch (e) { toast('Erreur : ' + e.message); return; }
      ouvrirFenetre('Mises à jour SportEasy', (f) => {
        f.classList.add('large');
        f.append(el('p', { class: 'petit' }, 'Différences entre la dernière extraction SportEasy et l\'application. « Appliquer » modifie la fiche ; « Ignorer » écarte la proposition, qui ne reviendra pas.'));
        const zone = el('div', {});
        const dessiner = () => {
          zone.replaceChildren();
          if (!props.length) { zone.append(el('p', { class: 'vide' }, 'Plus aucune proposition à valider.')); return; }
          for (const [type, titreGroupe] of SE_GROUPES) {
            const liste = props.filter(p => p.type === type);
            if (!liste.length) continue;
            zone.append(el('div', { class: 'se-groupe' }, titreGroupe + ' (' + liste.length + ')'));
            for (const p of liste) {
              const traiter = async (fonction, bouton) => {
                bouton.disabled = true;
                const { error } = await sbReel.rpc(fonction, { p_id: p.id });
                if (error) { bouton.disabled = false; toast('Erreur : ' + error.message); return; }
                toast(fonction === 'maj_sporteasy_appliquer' ? 'Appliqué.' : 'Ignoré.');
                props = props.filter(x => x.id !== p.id);
                dessiner(); majCarteSportEasy();
                if (fonction === 'maj_sporteasy_appliquer') charger();
              };
              const bA = el('button', { class: 'mini principal' }, 'Appliquer');
              const bI = el('button', { class: 'mini' }, 'Ignorer');
              bA.onclick = () => traiter('maj_sporteasy_appliquer', bA);
              bI.onclick = () => traiter('maj_sporteasy_ignorer', bI);
              zone.append(el('div', { class: 'se-ligne' },
                el('div', { class: 'texte' }, p.libelle, p.detail ? el('small', {}, p.detail) : null),
                el('div', { class: 'actions' }, bA, bI)));
            }
          }
        };
        dessiner();
        f.append(zone, el('div', { class: 'boutons' }, el('button', { class: 'btn secondaire', onclick: fermerFenetre }, 'Fermer')));
      });
    }

    // ---------- Session ----------
    function basculer(s) {
      session = s;
      $('ecranConnexion').hidden = !!s;
      $('ecranAppli').hidden = !s;
      if (!s) { AP.actif = null; AP.suisAdmin = false; dessinerBandeau(); $('btnApercu').hidden = true; $('carteSportEasy').hidden = true; }
      if (s) setTimeout(() => { charger(); majCarteNotif(); preparerPartenaires(); verifierAdmin(); }, 0);
    }
    sb.auth.onAuthStateChange((evenement, s) => {
      if (s && (location.search || location.hash)) history.replaceState(null, '', ADRESSE_APPLI);
      if (evenement === 'SIGNED_IN' || evenement === 'SIGNED_OUT' || evenement === 'INITIAL_SESSION') basculer(s);
    });
  </script>
</body>
</html>
